  const d = S.days[t0];
  if (d && d.off) {
    return `<button class="today-strip fade-in" data-act="open-day" data-ds="${t0}">
      <span class="ts-label eyebrow">Today</span><span class="off-tag">day off</span>
      <span class="ts-main">Off the clock — streak is safe</span>
      <span class="ts-go">${ic('right')}</span></button>`;
  }
  const { done, total } = statsFor(t0);
  const stt = statusFor(t0);
  let main;
  if (!d) main = 'Not opened yet — tap to load today\u2019s routine';
  else if (total && done === total) main = 'Day complete';
  else {
    const nx = d.routine.concat(d.extra).filter(t => !t.done)
      .sort((a, b) => (a.time || '99') < (b.time || '99') ? -1 : 1)[0];
    main = nx ? 'Next: ' + (nx.time ? `<span class="mono">${nx.time}</span> · ` : '') + esc(nx.title)
              : 'Nothing on the list yet';
  }
  return `<button class="today-strip ts-${stt} fade-in" data-act="open-day" data-ds="${t0}" aria-label="Open today">
    <span class="ts-label eyebrow">Today</span>
    ${d ? ring(total ? done / total : 0, 'st-' + stt, 22, 3) : ''}
    ${d ? `<span class="ts-frac mono">${done}/${total}</span>` : ''}
    <span class="ts-main">${main}</span>
    <span class="ts-go">${ic('right')}</span></button>`;
}
function renderCalendar() {
  cur = { view: 'cal', ds: null };
  const t0 = todayYMD();
  if (viewY === null) { const n = new Date(); viewY = n.getFullYear(); viewM = n.getMonth(); }
  if (!calFocus || fromYMD(calFocus).getMonth() !== viewM || fromYMD(calFocus).getFullYear() !== viewY) {
    const n = new Date();
    calFocus = (n.getFullYear() === viewY && n.getMonth() === viewM)
      ? (isWeekday(t0) ? t0 : nextWeekday(t0))
      : nextWeekday(ymd(new Date(viewY, viewM, 0)));   // first weekday of month
  }

  /* stats strip */
  const st = streak();
  const ms = monthStats(viewY, viewM);
  const cp = cptsPct();

  /* grid cells */
  const first = new Date(viewY, viewM, 1);
  const lead = (first.getDay() === 0 ? 7 : first.getDay()) - 1;
  const lastDay = new Date(viewY, viewM + 1, 0).getDate();
  let cells = '<div class="dow eyebrow">Mon</div><div class="dow eyebrow">Tue</div><div class="dow eyebrow">Wed</div><div class="dow eyebrow">Thu</div><div class="dow eyebrow">Fri</div><div class="dow eyebrow wkend">Sat</div><div class="dow eyebrow wkend">Sun</div>';
  for (let i = 0; i < lead; i++) cells += '<div class="cell cell-blank" aria-hidden="true"></div>';
  for (let d = 1; d <= lastDay; d++) {
    const ds = ymd(new Date(viewY, viewM, d));
    if (!isWeekday(ds)) {
      cells += `<div class="cell cell-off" aria-hidden="true"><span class="cell-date">${d}</span></div>`;
      continue;
    }
    const rec = S.days[ds];
    if (rec && rec.off) {
      cells += `<button class="cell cell-dayoff ${ds === t0 ? 'cell-today' : ''}" data-act="open-day" data-ds="${ds}"
          tabindex="${ds === calFocus ? 0 : -1}" aria-label="${fmtLong(ds)}, day off">
        <span class="cell-date">${d}</span>${ring(0, 'st-off')}<span class="cell-frac off-tag">off</span></button>`;
      continue;
    }
    const { done, total } = statsFor(ds);
    const stcls = 'st-' + statusFor(ds);
    const pct = total ? done / total : 0;
    const planned = rec && rec.extra.length
      ? `<span class="planned-dot" title="${rec.extra.length} planned">${rec.extra.length > 1 ? '<span>' + rec.extra.length + '</span>' : ''}</span>` : '';
    cells += `<button class="cell ${ds === t0 ? 'cell-today' : ''}" data-act="open-day" data-ds="${ds}"
        tabindex="${ds === calFocus ? 0 : -1}"
        aria-label="${fmtLong(ds)}${total ? ', ' + done + ' of ' + total + ' done' : ''}">
      <span class="cell-date">${d}</span>
      ${ring(pct, stcls)}
      <span class="cell-frac">${rec ? done + '/' + total : '&nbsp;'}</span>
      ${planned}
    </button>`;
  }

  app.innerHTML = topbarHTML() + `
  <section class="stats fade-in">
    <div class="stat"><span class="eyebrow">Streak</span>
      <span class="stat-val">${st}<small> day${st === 1 ? '' : 's'}</small></span></div>
    <div class="stat"><span class="eyebrow">This month</span>
      <span class="stat-val">${ms.total ? ms.done + '<small>/' + ms.total + ' days</small>' : '<small>—</small>'}</span></div>
    <div class="stat"><span class="eyebrow">HTB CPTS</span>
      <span class="stat-val cpts-edit" data-act="cpts-edit" title="Click to update — sections or %" role="button" tabindex="0">${cp}<small>%${S.settings.cptsTotal !== 100 ? ' · ' + S.settings.cptsDone + '/' + S.settings.cptsTotal : ''}</small></span>
      <div class="bar"><div class="bar-fill" style="width:${cp}%"></div></div></div>
  </section>
  ${todayStripHTML()}
  <section class="card fade-in">
    <div class="cal-head">
      <h1 class="cal-title">${monthLabel(viewY, viewM)}</h1>
      <div class="cal-nav">
        <button class="icon-btn" data-act="month-prev" aria-label="Previous month">${ic('left')}</button>
        <button class="btn btn-sm" data-act="month-today">Today</button>
        <button class="icon-btn" data-act="month-next" aria-label="Next month">${ic('right')}</button>
      </div>

  </section>
  <p class="hint">Click a day to open it · <span class="kbd">←→↑↓</span> move · <span class="kbd">Enter</span> open · <span class="kbd">?</span> all shortcuts</p>`;
}

/* Swap the CPTS figure for an inline input — accepts "45/495" or a percent */
function cptsEditor(anchor) {
  const el = (anchor && anchor.classList && anchor.classList.contains('cpts-edit')) ? anchor : $('.cpts-edit');
  if (!el) return;
  const val = S.settings.cptsTotal === 100 ? String(S.settings.cptsDone)
                                           : S.settings.cptsDone + '/' + S.settings.cptsTotal;
  el.outerHTML = `<input class="cpts-input" id="cptsInput" type="text" inputmode="numeric" value="${val}" aria-label="CPTS progress — sections done/total, or a percent">`;
  const inp = $('#cptsInput');
  const back = () => cur.view === 'stats' ? renderStats() : renderCalendar();
  let committed = false;
  const commit = () => {
    if (committed) return; committed = true;
    const m = inp.value.trim().match(/^(\d+)\s*\/\s*(\d+)$/);
    if (m) {
      S.settings.cptsTotal = Math.max(1, +m[2]);
      S.settings.cptsDone = clamp(+m[1], 0, S.settings.cptsTotal);
    } else if (inp.value.trim() !== '') {
      const n = Number(inp.value);
      if (Number.isFinite(n)) { S.settings.cptsDone = clamp(Math.round(n), 0, 100); S.settings.cptsTotal = 100; }
    }
    persist(); back();
  };
  inp.focus(); inp.select();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') commit(); if (e.key === 'Escape') { committed = true; back(); } });
  inp.addEventListener('blur', commit);
}

/* ════════════════════════════════════════════════════════════════
   DRAG-TO-REORDER  (pointer-based; works with touch via the grip)
   ════════════════════════════════════════════════════════════════ */
function attachSort(listEl, onDone) {
  if (!listEl) return;
  listEl.addEventListener('pointerdown', e => {
    const grip = e.target.closest('[data-grip]'); if (!grip) return;
    const row = grip.closest('[data-id]'); if (!row) return;
    e.preventDefault();
    row.classList.add('dragging'); row.style.pointerEvents = 'none';
    const move = ev => {
      const overEl = document.elementFromPoint(ev.clientX, ev.clientY);
      const over = overEl && overEl.closest ? overEl.closest('[data-id]') : null;
      if (over && over !== row && over.parentElement === listEl) {
        const r = over.getBoundingClientRect();
        listEl.insertBefore(row, ev.clientY < r.top + r.height / 2 ? over : over.nextSibling);
      }
    };
    const up = () => {
      row.classList.remove('dragging'); row.style.pointerEvents = '';
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up);
      onDone($$(':scope > [data-id]', listEl).map(n => n.dataset.id));
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  });
}
function reorderList(ds, list, ids) {
  const d = S.days[ds]; if (!d) return;
  /* Permute only the rows that were visible in the drag — tasks hidden
     by "hide completed" keep their slots instead of being dropped. */
  const pick = new Set(ids);
  const chosen = ids.map(id => d[list].find(t => t.id === id)).filter(Boolean);
  let i = 0;
  d[list] = d[list].map(t => pick.has(t.id) ? chosen[i++] : t);
  persist(); refreshDay();
}

function snippet(text, q) {
  const i = text.toLowerCase().indexOf(q);
  const a = Math.max(0, i - 34), b = Math.min(text.length, i + q.length + 46);
  return (a > 0 ? '…' : '') + esc(text.slice(a, i)) +
    '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' +
    esc(text.slice(i + q.length, b)) + (b < text.length ? '…' : '');
}
function searchIndex() {
  const out = [];

    d.extra.forEach(t => out.push({ ds, where: 'planned', text: t.title }));

  S.carry.forEach(c => out.push({ ds: todayYMD(), where: 'carry forward', text: c.text }));

}

/* ════════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════════ */
function renderStats() {
  cur = { view: 'stats', ds: null };
  const t0 = todayYMD();

  /* 17-week completion heatmap, Mon–Fri rows */
  const anchorDs = isWeekday(t0) ? t0 : prevWeekday(t0);
  const monThis = addDays(anchorDs, -(dowMon1(anchorDs) - 1));
  let heat = '<div class="heat"><div class="heat-col heat-labels">' +
    ['M','T','W','T','F'].map(l => `<span class="heat-lab eyebrow">${l}</span>`).join('') + '</div>';
  for (let wk = 16; wk >= 0; wk--) {
    const wstart = addDays(monThis, -7 * wk);
    heat += '<div class="heat-col">';
    for (let r = 0; r < 5; r++) {
      const ds = addDays(wstart, r);
      const { done, total } = statsFor(ds);
      const st = ds > t0 ? 'future' : (isOffDay(ds) ? 'offday' : statusFor(ds));
      heat += `<button class="heat-cell hc-${st}${ds === t0 ? ' hc-today' : ''}"
        ${ds > t0 ? 'disabled' : `data-act="open-day" data-ds="${ds}"`}
        title="${fmtShort(ds)}${isOffDay(ds) ? ' · day off' : (total ? ' · ' + done + '/' + total : '')}" aria-label="${fmtLong(ds)}"></button>`;
    }
    heat += '</div>';
  }
  heat += '</div>';

  /* last 30 elapsed weekdays: task completion + per-category split */
  const win = lastWeekdays(30);
  let td = 0, tt = 0;
  win.forEach(ds => { const s = statsFor(ds); td += s.done; tt += s.total; });
  const counts = new Map();
  win.forEach(ds => {
    const d = S.days[ds]; if (!d) return;
    d.routine.concat(d.extra).forEach(t => { if (t.done) counts.set(t.cat || '', (counts.get(t.cat || '') || 0) + 1); });
  });
  const maxC = Math.max(1, ...counts.values());
  const catRows = [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([cid, n]) => {
    const c = catById(cid);

      <span class="cb-lab">${c ? esc(c.label) : 'Uncategorised'}</span>
      <span class="cb-track"><span class="cb-fill" style="width:${(n / maxC * 100).toFixed(1)}%;background:${col}"></span></span>

  }).join('') || '<p class="empty">Tick tasks and the split shows up here.</p>';

  const now = new Date();

  const cp = cptsPct();

  app.innerHTML = topbarHTML() + `

    <div class="stat"><span class="eyebrow">Tasks · 30 days</span><span class="stat-val">${tt ? Math.round(td / tt * 100) + '<small>% of ' + tt + '</small>' : '<small>—</small>'}</span></div>

  <section class="card">

    <div class="heat-legend">

      <span><span class="heat-key" style="background:color-mix(in oklab,var(--info) 55%,var(--raised))"></span>in progress</span>

/* ════════════════════════════════════════════════════════════════
   EOD LOG — copy-ready markdown digest of a day
   ════════════════════════════════════════════════════════════════ */
function buildEOD(ds) {
  const d = S.days[ds] || { routine: [], extra: [], notes: '' };
  const all = d.routine.concat(d.extra);
  const line = t => '- [' + (t.done ? 'x' : ' ') + '] ' + (t.time ? t.time + ' ' : '') + t.title;
  const doneL = all.filter(t => t.done).map(line);
  const openL = all.filter(t => !t.done).map(line);
  const ahead = [];
  let p = nextWeekday(ds);
  for (let i = 0; i < 5; i++, p = nextWeekday(p)) {
    const r = S.days[p]; if (!r) continue;
    r.extra.forEach(t => ahead.push('- ' + fmtShort(p) + ': ' + t.title));
  }
  const parts = ['# EOD — ' + fmtLong(ds), '', 'Done ' + doneL.length + '/' + all.length,
                 ...(doneL.length ? doneL : ['- —'])];
  if (openL.length) parts.push('', 'Open', ...openL);
  if (ahead.length) parts.push('', 'Planned ahead', ...ahead);
  if (d.notes.trim()) parts.push('', 'Notes', d.notes.trim());
  if (S.carry.length) parts.push('', 'Carry-forward', ...S.carry.map(c => '- ' + c.text));
  return parts.join('\n') + '\n';
}
function openEOD(ds) {
  closeOverlay();
  overlays.innerHTML = `<div class="ov" role="dialog" aria-label="End of day log">
    <div class="ov-panel eod-panel">
      <div class="card-h"><span class="eyebrow">EOD log · ${fmtShort(ds)}</span>
        <span style="display:flex;gap:8px">
          <button class="btn btn-sm btn-acc" data-act="eod-copy">Copy</button>
          <button class="btn btn-sm" data-act="eod-dl">${ic('down')} .md</button>
        </span></div>
      <textarea class="notes-ta eod-ta" id="eodTa" spellcheck="false"></textarea>
      <p class="hint" style="margin:8px 2px 0">Built from the day\u2019s ticks, notes and carry list — tweak it, copy, paste into your 18:30 log.</p>
    </div></div>`;
  const ta = $('#eodTa');
  ta.value = buildEOD(ds);
  ta.style.height = Math.min(Math.round(window.innerHeight * 0.55), Math.max(220, ta.scrollHeight)) + 'px';
}

/* ════════════════════════════════════════════════════════════════
   NOW MARKER + EOD NUDGE  —  clock-aware touches (in-app only)
   ════════════════════════════════════════════════════════════════ */
function currentTaskId(now = new Date()) {
  if (cur.view !== 'day' || cur.ds !== todayYMD()) return null;
  const d = S.days[cur.ds]; if (!d || d.off) return null;
  const hm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  const timed = d.routine.concat(d.extra).filter(t => t.time && !t.done).sort((a, b) => a.time < b.time ? -1 : 1);
  const past = timed.filter(t => t.time <= hm);
  return past.length ? past[past.length - 1].id : null;
}
function updateNowMarker(now = new Date()) {
  document.querySelectorAll('.task.t-now').forEach(el => el.classList.remove('t-now'));
  const id = currentTaskId(now);
  if (!id) return;
  const row = document.querySelector(`.task[data-id="${id}"]`);
  if (row) row.classList.add('t-now');
}
function checkEodNudge(now = new Date()) {
  const t0 = todayYMD();
  const bar = $('#eodNudge');
  const kill = () => { if (bar) bar.remove(); };
  if (!isWeekday(t0) || isOffDay(t0) || dayComplete(t0)) return kill();
  const [h, m] = (S.settings.eodAt || '18:25').split(':').map(Number);
  const due = now.getHours() > h || (now.getHours() === h && now.getMinutes() >= m);
  let dismissed = false;
  try { dismissed = localStorage.getItem('dailyops.nudge') === t0; } catch (e) {}
  if (!due || dismissed) return kill();
  if (bar) return;
  const el = document.createElement('div');
  el.id = 'eodNudge';
  el.className = 'nudgebar fade-in';
  el.innerHTML = `${ic('clip')} <span>${S.settings.eodAt} — wrap the day and write your EOD log</span>
    <span class="spacer"></span>
    <button class="btn btn-sm btn-acc" data-act="nudge-eod">Open EOD log</button>

/* ════════════════════════════════════════════════════════════════
   WEEK VIEW  —  five days side by side, for planning and retro
   ════════════════════════════════════════════════════════════════ */
let viewWeekStart = null;              // Monday of the week being shown

function wkTaskHTML(t, list) {
  const c = taskColor(t);
  const tickStyle = c ? `border-color:${esc(c)};${t.done ? `background:${esc(c)};` : ''}` : '';
  return `<button class="wk-task ${t.done ? 'done' : ''} ${list === 'extra' ? 'wk-extra' : ''}"

    <span>${t.time ? `<span class="mono">${t.time}</span> ` : ''}${esc(t.title)}</span></button>`;
}
function renderWeek(keepScroll = false) {
  const sy = window.scrollY;
  cur = { view: 'week', ds: null };
  const t0 = todayYMD();
  if (!viewWeekStart) {
    const a = isWeekday(t0) ? t0 : nextWeekday(t0);
    viewWeekStart = addDays(a, -(dowMon1(a) - 1));
  }
  const days = [0, 1, 2, 3, 4].map(i => addDays(viewWeekStart, i));
  const LIMIT = 9;
  const col = ds => {
    const rec = S.days[ds];
    const off = rec && rec.off;
    const { done, total } = statsFor(ds);
    const head = `<button class="wk-day" data-act="open-day" data-ds="${ds}" title="Open ${fmtShort(ds)}">
        <span><span class="wk-name">${DAY_NAMES[dowMon1(ds)].slice(0, 3)}</span><br>
        <span class="wk-num">${Number(ds.slice(8))}</span></span>
        ${off ? '<span class="off-tag" style="margin-left:auto">off</span>'
              : rec ? ring(total ? done / total : 0, 'st-' + statusFor(ds), 22, 3) + `<span class="wk-count">${done}/${total}</span>`
                    : `<span class="wk-count">·</span>`}
      </button>`;
    let body = '';
    if (off) body = '<p class="wk-ghost">Day off — excluded from stats.</p>';
    else if (!rec) body = ds >= t0
      ? `<p class="wk-ghost">Opens with ${buildRoutine(ds).length} routine tasks.</p>`
      : '<p class="wk-ghost">Never opened.</p>';
    else {
      const rows = rec.routine.map(t => wkTaskHTML(t, 'routine'))
        .concat(rec.extra.length ? ['<div class="wk-sep">planned</div>'] : [])
        .concat(rec.extra.map(t => wkTaskHTML(t, 'extra')));
      body = rows.slice(0, LIMIT + (rows.length > LIMIT + 1 ? 0 : 1)).join('');
      const hidden = rows.length - (LIMIT + (rows.length > LIMIT + 1 ? 0 : 1));
      if (hidden > 0) body += `<button class="wk-task wk-more" data-act="open-day" data-ds="${ds}">+ ${hidden} more…</button>`;
      if (rec.notes.trim()) body += `<div class="wk-notes">${ic('note')} notes</div>`;
    }
    return `<div class="wk-col ${ds === t0 ? 'wk-today' : ''} ${off ? 'wk-off' : ''}" data-ds="${ds}">${head}${body}</div>`;
  };
  const label = fmtShort(days[0]).replace(/^\w+,?\s*/, '') + ' — ' + fmtShort(days[4]).replace(/^\w+,?\s*/, '');
  app.innerHTML = topbarHTML() + `
  <div class="fade-in">
  <div class="week-head">
    <button class="icon-btn" data-act="back-cal" title="Back — Esc" aria-label="Back to calendar">${ic('left')}</button>
    <h1 class="day-title">Week <span class="mono">· ${label}</span></h1>
    <span class="spacer"></span>
    <button class="icon-btn" data-act="week-prev" aria-label="Previous week">${ic('left')}</button>
    <button class="btn btn-sm" data-act="week-this">This week</button>
    <button class="icon-btn" data-act="week-next" aria-label="Next week">${ic('right')}</button>
  </div>
  <div class="week-grid">${days.map(col).join('')}</div>
  <p class="hint">Tick tasks straight from here · click a day header to open it · <span class="kbd">W</span> from anywhere</p>
  </div>`;
  if (keepScroll) window.scrollTo(0, sy);
}

/* ════════════════════════════════════════════════════════════════
   TRANSFER CODES  —  phone ↔ laptop without files
   ════════════════════════════════════════════════════════════════ */
const b64uEnc = bytes => {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000)
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
const b64uDec = str => Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

async function packState() {
  const bytes = new TextEncoder().encode(JSON.stringify(S));
  if (typeof CompressionStream === 'function') {
    try {
      const cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
      const buf = new Uint8Array(await new Response(cs).arrayBuffer());
      return 'DOPS2.' + b64uEnc(buf);
    } catch (e) { /* fall through to plain */ }
  }
  return 'DOPS0.' + b64uEnc(bytes);
}
async function unpackState(code) {
  const m = String(code).trim().match(/^DOPS([02])\.([A-Za-z0-9_-]+)$/);
  if (!m) throw new Error('not a transfer code');
  let bytes = b64uDec(m[2]);
  if (m[1] === '2') {
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    bytes = new Uint8Array(await new Response(ds).arrayBuffer());
  }
  return normalize(JSON.parse(new TextDecoder().decode(bytes)));
}
/* Build a full URL that carries the state in its fragment. Opening it on
   another device loads that state directly — the effortless path when the
   app is hosted (same origin on both devices). */
async function syncURL() {
  const code = await packState();               // DOPS0/DOPS2 string
  const base = location.origin + location.pathname;
  return base + '#/sync=' + encodeURIComponent(code);
}

/* Apply a transfer code to this device, with confirmation + undo. */
function importFromCode(code, how) {
  unpackState(code).then(restored => {
    const hadData = Object.keys(S.days).length > 0 || S.templates.length !== 11;
    const proceed = () => {
      const undo = snapshotUndo();
      S = restored; persist(); applyAccent(); go('/'); route();
      toast('Imported ' + Object.keys(S.days).length + ' day(s)' + (how === 'link' ? ' from the link' : ''), { undo, ms: 4000 });
    };
    if (!hadData) { proceed(); return; }
    /* This device already has data — ask before overwriting. */
    closeOverlay();
    overlays.innerHTML = `<div class="ov" role="dialog" aria-label="Confirm import">
      <div class="ov-panel eod-panel">
        <div class="card-h"><span class="eyebrow">Import & replace?</span></div>
        <p class="note-dim" style="margin-top:0">This will replace what's on <strong>this device</strong> with the incoming data (${Object.keys(restored.days).length} day${Object.keys(restored.days).length === 1 ? '' : 's'}). You can undo it right after from the toast.</p>
        <div class="data-actions" style="margin-top:12px">
          <button class="btn btn-acc" data-act="sync-confirm">Replace with incoming</button>
          <button class="btn" data-act="back-cal">Keep what's here</button>
        </div>
      </div></div>`;
    pendingImport = restored;
  }).catch(() => toast('That code wasn\u2019t recognised — copy it again in full'));
}
let pendingImport = null;
let cloud = { on: false, status: 'off', user: null, app: null, db: null, auth: null, unsub: null, applying: false, lastPush: 0 };
const CFG_KEY = 'dailyops.fbcfg';

/* One panel for moving data between devices: a link (best when hosted) and
   the raw code (works anywhere, including the offline single file). */
function openSync() {
  closeOverlay();
  const hosted = /^https?:$/.test(location.protocol);
  overlays.innerHTML = `<div class="ov" role="dialog" aria-label="Sync between devices">
    <div class="ov-panel eod-panel">

    </div></div>`;
  const body = $('#syncBody');
  syncURL().then(url => {
    const codePromise = packState();
    codePromise.then(code => {
      body.innerHTML = `
        ${hosted ? `
        <p class="note-dim" style="margin-top:0">On your <strong>other device</strong>, open this link — it loads everything you have here. Fastest phone ↔ laptop path.</p>

        <div class="data-actions" style="margin:10px 0 4px">

        ` : `

        `}
        <p class="hint" style="margin:10px 2px 0;color:var(--tx3)">Importing on the other device replaces its data — undoable there from the toast. Both devices stay independent afterwards; re-share to level them again.</p>`;
    });

/* Command palette targets (from the Ctrl+K box) */
function runCmd(cmd) {
  const t0 = todayYMD();
  const todayOr = f => isWeekday(t0) ? t0 : f(t0);
  switch (cmd) {
    case 'today': go('/day/' + todayOr(nextWeekday)); break;
    case 'cal': doAct('back-cal', document.body); break;
    case 'stats': go('/stats'); break;
    case 'week': viewWeekStart = null; go('/week'); break;
    case 'sync': openSync(); break;
    case 'settings': go('/settings'); break;
    case 'help': openHelp(); break;
    case 'export': doAct('export', document.body); break;
    case 'eod': eodDs = todayOr(prevWeekday); openEOD(eodDs); break;
    case 'plan': {
      const ds = todayOr(nextWeekday);
      go('/day/' + ds);
      setTimeout(() => { const i = $('#addExtraTitle'); if (i) i.focus(); }, 80);
      break;
    }

}

/* ════════════════════════════════════════════════════════════════
   ACTIONS — every [data-act] in the UI lands here
   ════════════════════════════════════════════════════════════════ */
function findTask(ds, list, id) {
  const d = S.days[ds]; if (!d) return null;
  return d[list].find(t => t.id === id) || null;
}
function weekendGuard(ds) {
  if (isWeekday(ds)) return false;
  toast('Weekends are off — pick a weekday');
  return true;
}

function doAct(act, el) {
  const row = el.closest ? el.closest('[data-id]') : null;
  const id = el.dataset.id || (row && row.dataset.id);
  const list = el.dataset.list || (row && row.dataset.list);

  switch (act) {
    /* ── navigation ── */
    case 'nav-cal': case 'back-cal':
      if (cur.view === 'day' && cur.ds) { const d = fromYMD(cur.ds); viewY = d.getFullYear(); viewM = d.getMonth(); calFocus = cur.ds; }
      { const wasCal = location.hash === '' || location.hash === '#/';
        go('/'); if (wasCal) route(); }
      break;
    case 'open-day': go('/day/' + el.dataset.ds); break;
    case 'jump-today': go('/day/' + todayYMD()); break;
    case 'day-prev': go('/day/' + prevWeekday(cur.ds)); break;
    case 'day-next': go('/day/' + nextWeekday(cur.ds)); break;
    case 'open-settings': go('/settings'); break;
    case 'month-prev': viewM--; if (viewM < 0) { viewM = 11; viewY--; } calFocus = null; renderCalendar(); break;
    case 'month-next': viewM++; if (viewM > 11) { viewM = 0; viewY++; } calFocus = null; renderCalendar(); break;
    case 'month-today': { const n = new Date(); viewY = n.getFullYear(); viewM = n.getMonth(); calFocus = null; renderCalendar(); break; }
    case 'open-search': overlayOpen() ? closeOverlay() : openSearch(); break;
    case 'open-help': overlayOpen() ? closeOverlay() : openHelp(); break;
    case 's-open': { const ds = el.dataset.ds; closeOverlay(); go('/day/' + ds); if (cur.ds === ds) renderDay(ds); break; }
    case 'cpts-edit': cptsEditor(el); break;

    /* ── tasks on a day ── */
    case 'toggle-task': {
      const host = el.closest('[data-ds]');             // week columns carry their date
      const dsx = (host && host.dataset.ds) || cur.ds;
      const t = findTask(dsx, list, id); if (!t) break;
      const wasComplete = dayComplete(dsx);
      t.done = !t.done; persist();
      if (!wasComplete && dayComplete(dsx)) {           // just finished that day
        if (cur.view === 'day') celebrate = true;
        toast('Day complete — ' + streak() + '-day streak', { ms: 3200 });
      }
      if (cur.view === 'week') { renderWeek(true); }
      else { focusTaskId = id; refreshDay(); updateNowMarker(); }
      break;
    }
    case 'edit-task': editingTaskId = id; carryMoveId = null; refreshDay(); break;
    case 'cancel-edit': editingTaskId = null; refreshDay(); break;
    case 'save-task': {
      const box = el.closest('.task-edit'); if (!box) break;
      const t = findTask(cur.ds, box.dataset.list, box.dataset.id); if (!t) break;
      const title = $('[data-f=edit-title]', box).value.trim();
      if (title) t.title = title;
      t.time = $('[data-f=edit-time]', box).value || null;
      t.cat = $('[data-f=edit-cat]', box).value || null;
      t.color = $('[data-f=edit-clr-on]', box).checked ? $('[data-f=edit-clr]', box).value : null;
      editingTaskId = null; persist(); refreshDay(); break;
    }
    case 'del-task': {
      const undo = snapshotUndo();
      const d = S.days[cur.ds]; if (!d) break;
      d[list] = d[list].filter(t => t.id !== id);
      editingTaskId = null; persist(); refreshDay();
      toast('Task deleted', { undo }); break;
    }
    case 'add-routine': {
      const ti = $('#addRoutineTitle'), tm = $('#addRoutineTime');
      const title = ti.value.trim(); if (!title) { ti.focus(); break; }
      S.days[cur.ds].routine.push({ id: uid(), tid: null, title, time: tm.value || null, cat: null, done: false });
      persist(); refreshDay(); const n = $('#addRoutineTitle'); if (n) n.focus(); break;
    }
    case 'add-extra': {
      const ti = $('#addExtraTitle'), tm = $('#addExtraTime'), dt = $('#addExtraDate');
      const title = ti.value.trim(); if (!title) { ti.focus(); break; }
      const target = /^\d{4}-\d{2}-\d{2}$/.test(dt.value) ? dt.value : cur.ds;
      if (weekendGuard(target)) break;
      ensureDay(target).extra.push({ id: uid(), title, time: tm.value || null, cat: null, done: false });
      persist();
      if (target === cur.ds) { refreshDay(); const n = $('#addExtraTitle'); if (n) n.focus(); }
      else {
        ti.value = ''; tm.value = '';
        toast('Planned for ' + fmtShort(target), { actionLabel: 'View', action: () => go('/day/' + target) });
      }
      break;
    }

    /* ── notes ── */
    case 'notes-write': notesMode = 'write'; refreshDay(); break;
    case 'notes-preview': { const ta = $('#notesTa'); if (ta) { S.days[cur.ds].notes = ta.value; persist(); } notesMode = 'preview'; refreshDay(); break; }
    case 'md-bold': mdWrap('**'); break;
    case 'md-code': mdWrap('`'); break;
    case 'md-block': mdWrap('\n```\n', '\n```\n'); break;
    case 'md-list': mdWrap('- ', ''); break;

    /* ── carry forward ── */
    case 'carry-add': {
      const inp = $('#addCarryText'); const text = inp.value.trim();
      if (!text) { inp.focus(); break; }
      S.carry.push({ id: uid(), text });
      persist(); refreshDay(); const n = $('#addCarryText'); if (n) n.focus(); break;
    }
    case 'carry-done': {
      const undo = snapshotUndo();
      S.carry = S.carry.filter(c => c.id !== id);
      persist(); refreshDay(); toast('Cleared', { undo }); break;
    }
    case 'carry-move': carryMoveId = id; editingTaskId = null; refreshDay();
      { const di = $('#carryDate'); if (di) di.focus(); } break;
    case 'carry-cancel': carryMoveId = null; refreshDay(); break;
    case 'carry-move-go': {
      const c = S.carry.find(x => x.id === id); if (!c) break;
      const target = $('#carryDate').value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(target)) break;
      if (weekendGuard(target)) break;
      const undo = snapshotUndo();
      ensureDay(target).extra.push({ id: uid(), title: c.text, time: null, cat: null, done: false });
      S.carry = S.carry.filter(x => x.id !== id);
      carryMoveId = null; persist(); refreshDay();
      toast('Moved to ' + fmtShort(target), { undo, actionLabel: 'View', action: () => go('/day/' + target) });
      break;
    }

    /* ── v2: stats, EOD, pull-in, hide-done, palette ── */
    case 'open-stats': go('/stats'); break;
    case 'hide-done': S.settings.hideDone = !S.settings.hideDone; persist(); refreshDay(); break;
    case 'pull-in': {
      const from = el.dataset.ds, rec = S.days[from];
      if (!rec) break;
      const moving = rec.extra.filter(t => !t.done);
      if (!moving.length) break;
      const undo = snapshotUndo();
      rec.extra = rec.extra.filter(t => t.done);
      const dest = ensureDay(cur.ds);
      moving.forEach(t => dest.extra.push({ ...t, id: uid(), time: null })); // old times belonged to that day
      persist(); refreshDay();
      toast('Pulled ' + moving.length + ' in from ' + fmtShort(from), { undo });
      break;
    }
    case 'eod': eodDs = cur.ds || todayYMD(); openEOD(eodDs); break;
    case 'eod-copy': {
      const ta = $('#eodTa'); if (!ta) break;
      ta.focus(); ta.select();
      const ok = () => toast('Copied — paste it into your EOD');
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(ta.value).then(ok, () => { document.execCommand('copy'); ok(); });
      else { document.execCommand('copy'); ok(); }
      break;
    }
    case 'eod-dl': {
      const ta = $('#eodTa'); if (!ta) break;
      try {
        const blob = new Blob([ta.value], { type: 'text/markdown' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'eod-' + (eodDs || todayYMD()) + '.md';
        a.click(); URL.revokeObjectURL(a.href);
      } catch (err) { toast('Download failed — use Copy instead'); }
      break;
    }
    case 's-cmd': closeOverlay(); runCmd(el.dataset.cmd); break;
    case 'bk-link': linkBackup(); break;
    case 'bk-now': writeBackup().then(() => toast('Backed up to your file')); break;
    case 'bk-unlink': unlinkBackup(); break;
    case 'bk-reconnect': { const b = $('#reconnectBar'); if (b) b.remove(); reconnectBackup(); break; }

    /* ── v3: day off, week, nudge, transfer, nav ── */
    case 'toggle-off': {
      const d = ensureDay(cur.ds);
      d.off = !d.off;
      persist(); refreshDay();
      toast(d.off ? 'Marked as day off — streaks and stats skip it' : 'Back on the clock');
      break;
    }
    case 'open-week': viewWeekStart = null; go('/week'); break;
    case 'week-prev': viewWeekStart = addDays(viewWeekStart, -7); renderWeek(); break;
    case 'week-next': viewWeekStart = addDays(viewWeekStart, 7); renderWeek(); break;
    case 'week-this': viewWeekStart = null; renderWeek(); break;
    case 'nav-today': { const t0 = todayYMD(); go('/day/' + (isWeekday(t0) ? t0 : nextWeekday(t0))); break; }
    case 'nudge-eod': {
      try { localStorage.setItem('dailyops.nudge', todayYMD()); } catch (e) {}
      const b = $('#eodNudge'); if (b) b.remove();
      eodDs = todayYMD(); openEOD(eodDs); break;
    }
    case 'nudge-dismiss': {
      try { localStorage.setItem('dailyops.nudge', todayYMD()); } catch (e) {}
      const b = $('#eodNudge'); if (b) b.remove(); break;
    }
    case 'xfer-copy': {
      packState().then(code => {
        const done = () => toast('Transfer code copied — paste it on the other device (' + code.length + ' chars)');

          'user-not-found': 'No account with that email — create one first.', 'wrong-password': 'Wrong password.',

        if (errEl) errEl.textContent = msg; el.disabled = false; el.textContent = authMode === 'signup' ? 'Create account & sync' : 'Sign in';

        else { const t = $('#syncUrlBox'); if (t) { t.select(); document.execCommand('copy'); } ok(); }

    }
    case 'sync-copy-code': {
      packState().then(code => {
        const ok = () => toast('Transfer code copied');
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok, ok);
        else ok();
      });
      break;
    }
    case 'xfer-apply': {
      const ta = $('#xferTa'); if (!ta) break;
      const v = ta.value.trim(); closeOverlay();
      importFromCode(v, 'paste');
      break;
    }
    case 'sync-confirm': {
      if (!pendingImport) break;
      const undo = snapshotUndo();
      S = pendingImport; pendingImport = null;
      persist(); applyAccent(); closeOverlay(); go('/'); route();
      toast('Imported ' + Object.keys(S.days).length + ' day(s)', { undo, ms: 4000 });
      break;
    }

    /* ── settings: appearance ── */
    case 'acc-swatch':
      S.settings.accent = el.dataset.c; applyAccent(); persist(); renderSettings(); break;

    /* ── settings: routine templates ── */
    case 'tpl-open': tplOpenId = id; renderSettings(); break;
    case 'tpl-close': tplOpenId = null; renderSettings(); break;
    case 'tpl-add': {
      const maxo = S.templates.reduce((m, t) => Math.max(m, t.order ?? 0), -1);
      const nt = { id: uid(), time: '12:00', title: '', days: [1, 2, 3, 4, 5], cat: null, color: null, order: maxo + 1 };
      S.templates.push(nt); tplOpenId = nt.id;
      persist(); renderSettings();
      const ti = $('[data-f=tpl-title]'); if (ti) ti.focus();
      break;
    }
    case 'tpl-del': {
      const undo = snapshotUndo();
      tplOpenId = null;
      S.templates = S.templates.filter(t => t.id !== id);
      persist(); applyTemplatesForward(); renderSettings();
      toast('Routine task removed', { undo }); break;
    }
    case 'tpl-day': {
      const t = tplById(id); if (!t) break;
      const dn = Number(el.dataset.d);
      t.days = t.days.includes(dn) ? t.days.filter(x => x !== dn) : [...t.days, dn].sort();
      persist(); applyTemplatesForward(); renderSettings(); break;
    }

    /* ── settings: categories ── */
    case 'cat-add':
      S.categories.push({ id: uid(), label: 'New category', color: '#8b7cff' });
      persist(); renderSettings();
      { const rows = $$('.cat-row'); const last = rows[rows.length - 1];
        if (last) { const i = $('[data-f=cat-label]', last); i.focus(); i.select(); } }
      break;
    case 'cat-del': {
      const undo = snapshotUndo();
      S.categories = S.categories.filter(c => c.id !== id);
      S.templates.forEach(t => { if (t.cat === id) t.cat = null; });
      for (const k of Object.keys(S.days)) {
        S.days[k].routine.forEach(t => { if (t.cat === id) t.cat = null; });
        S.days[k].extra.forEach(t => { if (t.cat === id) t.cat = null; });
      }
      persist(); renderSettings(); toast('Category deleted', { undo }); break;
    }

    /* ── settings: links ── */
    case 'link-add':
      S.settings.links.push({ id: uid(), label: 'New link', url: '' });
      persist(); renderSettings();
      { const rows = $$('.link-row'); const last = rows[rows.length - 1];
        if (last) { const i = $('[data-f=link-label]', last); i.focus(); i.select(); } }
      break;
    case 'link-del': {
      const undo = snapshotUndo();
      S.settings.links = S.settings.links.filter(l => l.id !== id);
      persist(); renderSettings(); toast('Link removed', { undo }); break;
    }

    /* ── settings: data ── */
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'dailyops-backup-' + todayYMD() + '.json';
      a.click(); URL.revokeObjectURL(a.href);
      S.settings.lastExport = new Date().toISOString(); persist();
      if (cur.view === 'set') renderSettings();
      toast('Backup downloaded'); break;
    }
    case 'import': $('#fileImport').click(); break;
    case 'reset': {
      const undo = snapshotUndo();
      try { localStorage.setItem('dailyops.backup', JSON.stringify(S)); } catch (e) {}
      S = seed(); persist(); applyAccent(); route();
      toast('Everything reset', { undo }); break;
    }
  }
}

/* Markdown toolbar helper — wraps the current selection */
function mdWrap(pre, post = pre) {
  const ta = $('#notesTa'); if (!ta) return;
  const s = ta.selectionStart, e = ta.selectionEnd, v = ta.value;
  const sel = v.slice(s, e);
  ta.value = v.slice(0, s) + pre + sel + post + v.slice(e);
  ta.focus();
  ta.setSelectionRange(s + pre.length, s + pre.length + sel.length);
  ta.dispatchEvent(new Event('input'));
}

/* ════════════════════════════════════════════════════════════════
   DELEGATED EVENTS
   ════════════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const ab = e.target.closest('[data-act]');
  if (ab) { doAct(ab.dataset.act, ab); return; }
  const row = e.target.closest('.task');            // whole row is a tap target
  if (row && !e.target.closest('[data-grip]')) { doAct('toggle-task', row); return; }
  if (e.target.classList.contains('ov')) closeOverlay();
});

/* Live edits on Settings fields — mutate state without re-rendering,
   so typing never loses focus. */
function handleField(el) {
  const f = el.dataset.f;
  const row = el.closest('[data-id]');
  const id = row && row.dataset.id;
  if (f === 'acc-custom') { S.settings.accent = el.value; applyAccent(); saveSoon(); return; }
  if (f === 'eod-at') {
    if (/^\d{2}:\d{2}$/.test(el.value)) { S.settings.eodAt = el.value; saveSoon(); checkEodNudge(); }
    return;
  }
  if (f === 'tpl-clr-on' || f === 'tpl-clr') {
    const t = tplById(id); if (!t) return;
    const row = el.closest('.tpl-row');
    t.color = $('[data-f=tpl-clr-on]', row).checked ? $('[data-f=tpl-clr]', row).value : null;
    saveSoon(); applyTemplatesForwardSoon(); return;
  }
  if (f === 'tpl-time' || f === 'tpl-title' || f === 'tpl-cat') {
    const t = tplById(id); if (!t) return;
    if (f === 'tpl-time') t.time = el.value || null;
    if (f === 'tpl-title') t.title = el.value;
    if (f === 'tpl-cat') t.cat = el.value || null;
    saveSoon(); applyTemplatesForwardSoon(); return;
  }
  if (f === 'cat-label' || f === 'cat-color') {
    const c = catById(id); if (!c) return;
    if (f === 'cat-label') c.label = el.value;
    if (f === 'cat-color') c.color = el.value;
    saveSoon(); return;
  }
  if (f === 'link-label' || f === 'link-url') {
    const l = linkById(id); if (!l) return;
    if (f === 'link-label') l.label = el.value;
    if (f === 'link-url') l.url = el.value;
    saveSoon(); return;
  }
}
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.f) handleField(e.target); });
document.addEventListener('change', e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.f) return;
  if (el.dataset.f === 'link-url' && el.value && !/^[a-z]+:\/\//i.test(el.value)) {
    el.value = 'https://' + el.value;               // forgive missing scheme
  }
  if (el.dataset.f === 'acc-custom') { handleField(el); renderSettings(); return; }
  handleField(el);
});

/* Import file chosen */
$('#fileImport').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let obj;
    try { obj = JSON.parse(rd.result); } catch { toast('That file isn\u2019t valid JSON'); return; }
    if (!obj || typeof obj !== 'object' || !obj.days || !obj.version) {
      toast('That doesn\u2019t look like a Daily Ops backup'); return;
    }
    const undo = snapshotUndo();
    try { localStorage.setItem('dailyops.backup', JSON.stringify(S)); } catch (err) {}
    S = normalize(obj); persist(); applyAccent(); route();
    toast('Backup imported', { undo });
  };
  rd.readAsText(file);
});

/* ════════════════════════════════════════════════════════════════
   KEYBOARD
   ════════════════════════════════════════════════════════════════ */
function focusedTaskRow() {
  const a = document.activeElement;
  return a && a.classList && a.classList.contains('task') ? a : null;
}
function moveTaskFocus(dir) {
  const rows = $$('.task');
  if (!rows.length) return;
  const i = rows.indexOf(focusedTaskRow());
  const next = rows[clamp(i + dir, 0, rows.length - 1)] || rows[0];
  next.focus();
}
function nudgeTask(dir) {
  const r = focusedTaskRow(); if (!r) return;
  const d = S.days[cur.ds]; if (!d) return;
  const list = d[r.dataset.list];
  const i = list.findIndex(t => t.id === r.dataset.id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  persist(); focusTaskId = r.dataset.id; refreshDay();
}

document.addEventListener('keydown', e => {
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

  /* always-available */
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); overlayOpen() ? closeOverlay() : openSearch(); return;
  }
  if (e.key === 'Escape') {
    if (overlayOpen()) { closeOverlay(); return; }
    if (typing) { document.activeElement.blur(); return; }
    if (editingTaskId) { editingTaskId = null; refreshDay(); return; }
    if (carryMoveId) { carryMoveId = null; refreshDay(); return; }
    if (cur.view !== 'cal') doAct('back-cal', document.body);
    return;
  }
  if (typing || overlayOpen()) return;

  /* activate the CPTS inline editor from keyboard */
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.dataset
      && document.activeElement.dataset.act === 'cpts-edit') {
    e.preventDefault(); cptsEditor(); return;
  }
  if (cur.view === 'cal' && (e.key === 'w' || e.key === 'W')) {
    e.preventDefault(); doAct('open-week', document.body); return;
  }
  if (e.key === '?') { openHelp(); return; }
  if (e.key === '/') { e.preventDefault(); openSearch(); return; }

  if (cur.view === 'cal') {
    const moveTo = ds => {
      calFocus = ds;
      const d = fromYMD(ds);
      if (d.getMonth() !== viewM || d.getFullYear() !== viewY) { viewY = d.getFullYear(); viewM = d.getMonth(); }
      renderCalendar();
      const c = $(`.cell[data-ds="${ds}"]`); if (c) c.focus();
    };
    switch (e.key) {
      case 'ArrowLeft':  e.preventDefault(); moveTo(prevWeekday(calFocus)); break;
      case 'ArrowRight': e.preventDefault(); moveTo(nextWeekday(calFocus)); break;
      case 'ArrowUp':    e.preventDefault(); moveTo(addDays(calFocus, -7)); break;
      case 'ArrowDown':  e.preventDefault(); moveTo(addDays(calFocus, 7)); break;
      case 'Enter': if (document.activeElement === document.body) go('/day/' + calFocus); break;
      case 't': case 'T': { const t0 = todayYMD(); moveTo(isWeekday(t0) ? t0 : nextWeekday(t0)); break; }
      case '[': doAct('month-prev', document.body); break;
      case ']': doAct('month-next', document.body); break;
    }
    return;
  }

  if (cur.view === 'day') {
    switch (e.key) {
      case 'ArrowDown': case 'j': e.preventDefault();
        if (e.altKey) nudgeTask(1); else moveTaskFocus(1); break;
      case 'ArrowUp': case 'k': e.preventDefault();
        if (e.altKey) nudgeTask(-1); else moveTaskFocus(-1); break;
      case ' ': case 'x': case 'X': case 'Enter': {
        const r = focusedTaskRow();
        if (r) { e.preventDefault(); doAct('toggle-task', r); }
        break;
      }
      case 'e': case 'E': { const r = focusedTaskRow(); if (r) { editingTaskId = r.dataset.id; refreshDay(); } break; }
      case 'Delete': { const r = focusedTaskRow(); if (r) doAct('del-task', r); break; }
      case 'ArrowLeft':  doAct('day-prev', document.body); break;
      case 'ArrowRight': doAct('day-next', document.body); break;
      case 'a': case 'A': e.preventDefault(); { const i = $('#addExtraTitle'); if (i) i.focus(); } break;
      case 'r': case 'R': e.preventDefault(); { const i = $('#addRoutineTitle'); if (i) i.focus(); } break;
      case 't': case 'T': if (cur.ds !== todayYMD()) doAct('jump-today', document.body); break;
      case 'w': case 'W': doAct('open-week', document.body); break;
      case 'n': case 'N': e.preventDefault();
        if (notesMode !== 'write') { notesMode = 'write'; refreshDay(); }
        { const ta = $('#notesTa'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
        break;
    }
  }
});

/* ═══ CLOUD SYNC — Firebase Auth + Firestore live sync (opt-in) ═══ */
const FB_VER = '10.12.2';
/* Built-in project config — sync works out of the box, no setup on any
   device. These keys are public by design (Firebase security lives in
   the Firestore rules, which lock each account to its own data). */
const BUILTIN_CFG = {
  apiKey: "AIzaSyDxkh5V7hv7a5dWPPbk4BY3SS-vBt70MB4",
  authDomain: "daily-ops-a878c.firebaseapp.com",
  projectId: "daily-ops-a878c",
  storageBucket: "daily-ops-a878c.firebasestorage.app",
  messagingSenderId: "278477888218",
  appId: "1:278477888218:web:e352fc35988c0a1b4a23e3"
};
const getCfg = () => {
  try { const o = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); if (o && o.apiKey && o.projectId && o.appId) return o; } catch (e) {}
  return BUILTIN_CFG;                       // fall back to the built-in project
};
const hasCfg = () => { const c = getCfg(); return !!(c && c.apiKey && c.projectId && c.appId); };
function setCloudStatus(s) {
  cloud.status = s;
  const pill = $('#cloudPill'); if (!pill) return;
  pill.className = 'cloud-pill' + (s === 'live' ? ' on' : s === 'syncing' ? ' syncing' : s === 'error' ? ' err' : '');
  const label = { off: 'Sync off', 'signed-out': 'Sign in to sync', connecting: 'Connecting…', syncing: 'Syncing…', live: 'Synced', error: 'Sync error' }[s] || 'Sync';
  const t = pill.querySelector('.cp-txt'); if (t) t.textContent = label;
  pill.title = cloud.user ? ('Cloud sync — ' + cloud.user.email) : label;
}
let fbMods = null;
async function loadFirebase() {
  if (fbMods) return fbMods;
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}`;
  const [appM, authM, fsM] = await Promise.all([
    import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-firestore.js`) ]);
  fbMods = { appM, authM, fsM }; return fbMods;
}
async function cloudInit(interactive) {
  if (!hasCfg()) { if (interactive) openCloud(); return; }
  setCloudStatus('connecting');
  let m; try { m = await loadFirebase(); } catch (e) { setCloudStatus('error'); if (interactive) toast('Could not load sync — check your connection'); return; }
  try {
    cloud.app = m.appM.initializeApp(getCfg());
    cloud.auth = m.authM.getAuth(cloud.app);
    try { cloud.db = m.fsM.initializeFirestore(cloud.app, { localCache: m.fsM.persistentLocalCache({}) }); }
    catch (e) { cloud.db = m.fsM.getFirestore(cloud.app); }
    m.authM.onAuthStateChanged(cloud.auth, u => {
      cloud.user = u; cloud.on = !!u;
      if (u) { setCloudStatus('syncing'); attachDoc(); if (cur.view === 'set') renderSettings(); }
      else { detachDoc(); setCloudStatus('signed-out'); if (cur.view === 'set') renderSettings(); }
    });
  } catch (e) { setCloudStatus('error'); if (interactive) toast('Sync setup failed — re-check your Firebase config'); }
}
function docRef() { const { doc } = fbMods.fsM; return doc(cloud.db, 'users', cloud.user.uid, 'state', 'main'); }
async function attachDoc() {
  const { getDoc, onSnapshot, setDoc } = fbMods.fsM; detachDoc();
  try {
    const ref = docRef();
    const snap = await getDoc(ref);
    if (!snap.exists()) { await setDoc(ref, { state: JSON.stringify(S), updated: Date.now() }); }
    else {
      const remote = snap.data();
      if (remote && remote.state) {
        const parsed = normalize(JSON.parse(remote.state));
        const localEmpty = Object.keys(S.days).length === 0 && S.templates.length === 11;
        if (!localEmpty && Object.keys(parsed.days).length === 0) { await setDoc(ref, { state: JSON.stringify(S), updated: Date.now() }); }
        else { cloud.applying = true; S = parsed; persistLocalOnly(); applyAccent(); route(); cloud.applying = false; }
      }
    }
    cloud.unsub = onSnapshot(ref, snap => {
      if (!snap.exists() || snap.metadata.hasPendingWrites) return;
      const data = snap.data(); if (!data || !data.state) return;
      if (Date.now() - cloud.lastPush < 400) return;
      try { const parsed = normalize(JSON.parse(data.state)); cloud.applying = true; S = parsed; persistLocalOnly(); applyAccent(); route(); cloud.applying = false; toast('Synced — your other device made a change', { ms: 2600, variant: 'sync', icon: 'phone' }); } catch (e) {}
      setCloudStatus('live');
    }, err => setCloudStatus('error'));
    setCloudStatus('live');
  } catch (e) { setCloudStatus('error'); }
}
function detachDoc() { if (cloud.unsub) { try { cloud.unsub(); } catch (e) {} cloud.unsub = null; } }
async function pushCloud() {
  if (!cloud.on || cloud.applying || !cloud.db || !cloud.user || !fbMods) return;
  try { const { setDoc } = fbMods.fsM; cloud.lastPush = Date.now(); setCloudStatus('syncing'); await setDoc(docRef(), { state: JSON.stringify(S), updated: Date.now() }); setCloudStatus('live'); }
  catch (e) { setCloudStatus('error'); }
}
const pushCloudSoon = debounce(pushCloud, 700);
async function cloudSignup(email, pass) { const { createUserWithEmailAndPassword } = fbMods.authM; return createUserWithEmailAndPassword(cloud.auth, email, pass); }
async function cloudLogin(email, pass) { const { signInWithEmailAndPassword } = fbMods.authM; return signInWithEmailAndPassword(cloud.auth, email, pass); }
async function cloudLogout() {
  const { signOut } = fbMods.authM; detachDoc();
  try { await signOut(cloud.auth); } catch (e) {}
  cloud.user = null; cloud.on = false; setCloudStatus(hasCfg() ? 'signed-out' : 'off');
  toast('Signed out — this device is local again'); if (cur.view === 'set') renderSettings();
}
let authMode = 'login';
function openCloud() {
  closeOverlay();
  overlays.innerHTML = cloudAuthHTML(); setTimeout(() => { const e = $('#authEmail'); if (e) e.focus(); }, 30);
}

function cloudAuthHTML() {
  return `<div class="ov" role="dialog" aria-label="Sign in to sync"><div class="ov-panel eod-panel">
      <div class="card-h"><span class="eyebrow">${authMode === 'signup' ? 'Create your sync account' : 'Sign in to sync'}</span></div>
      <div class="auth-tabs">
        <button class="auth-tab ${authMode === 'login' ? 'on' : ''}" data-act="auth-mode" data-m="login">Sign in</button>
        <button class="auth-tab ${authMode === 'signup' ? 'on' : ''}" data-act="auth-mode" data-m="signup">Create account</button></div>
      <div class="auth-field"><label>Email</label><input type="email" id="authEmail" autocomplete="username" placeholder="you@email.com"></div>
      <div class="auth-field"><label>Password</label><input type="password" id="authPass" autocomplete="${authMode === 'signup' ? 'new-password' : 'current-password'}" placeholder="${authMode === 'signup' ? 'at least 6 characters' : 'your password'}"></div>
      <p class="auth-err" id="authErr"></p>
      <div class="data-actions"><button class="btn btn-acc" data-act="auth-go">${authMode === 'signup' ? 'Create account & sync' : 'Sign in'}</button><button class="btn" data-act="back-cal">Cancel</button></div>
      <p class="auth-note">New here? Create an account, then sign in with the same email and password on your other device — both stay in sync automatically. Your data is private to you.</p>
    </div></div>`;
}
function firstRuleHint() { return "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /users/{uid}/{document=**} {\n      allow read, write: if request.auth != null && request.auth.uid == uid;\n    }\n  }\n}"; }

function route() {
  closeOverlay();
  editingTaskId = null; carryMoveId = null;
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('/sync=')) {                  // arrived via a sync link
    const code = decodeURIComponent(h.slice(6));
    try { history.replaceState(null, '', location.pathname); } catch (e) {}  // strip payload, no re-route
    importFromCode(code, 'link');
    return;
  }
  if (h.startsWith('/day/')) {
    const ds = h.slice(5);
    if (/^\d{4}-\d{2}-\d{2}$/.test(ds) && isWeekday(ds)) { renderDay(ds); return; }
  }
  if (h === '/settings') { renderSettings(); return; }
  if (h === '/stats') { renderStats(); return; }
  if (h === '/week') { renderWeek(); return; }
  renderCalendar();
}
window.addEventListener('hashchange', route);

applyAccent();
if (!storageOK && !AS) $('#banner').classList.add('show');
$('#tabbar').innerHTML = [
  ['nav-cal', 'cal', 'cal', 'Month'],
  ['open-week', 'week', 'week', 'Week'],
  ['nav-today', 'day', 'target', 'Today'],
  ['open-stats', 'stats', 'chart', 'Stats'],
  ['open-settings', 'set', 'gear', 'Settings'],
].map(([act, view, icon, label]) =>
  `<button class="tab-i" data-act="${act}" data-view="${view}" aria-label="${label}">${ic(icon)}<span>${label}</span></button>`).join('');
(async () => {
  /* Inside an artifact, localStorage is blocked — pull saved state from
     artifact storage before the first paint so nothing looks lost. */
  if (AS) {
    let hadLocal = false;
    try { hadLocal = !!localStorage.getItem(DB_KEY); } catch (e) {}
    if (!hadLocal) {
      try {
        const r = await AS.get(DB_KEY);
        if (r && r.value) { S = normalize(JSON.parse(r.value)); applyAccent(); }
      } catch (e) { /* first run — nothing saved yet */ }
    }
  }
  route();
})();
initBackup();   // reconnect a previously linked backup file, restore if this browser is empty
checkEodNudge();
cloudInit(false);   // built-in config → connect and restore any signed-in session automatically
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});   // PWA offline cache; silently absent on file://
}

/* Test / console handle — lets tooling drive the backup engine and read its
   live state. No data beyond what the app already holds; safe to keep. */
window.__ops = {
  get S() { return S; }, set S(v) { S = v; },
  get bkState() { return bkState; }, set bkState(v) { bkState = v; },
  get bkHandle() { return bkHandle; }, set bkHandle(v) { bkHandle = v; },
  FS_OK, idb, linkBackup, unlinkBackup, reconnectBackup, writeBackup, maybeRestore,
  persist, normalize, snapshotUndo, packState, unpackState, checkEodNudge, updateNowMarker,
  syncURL, importFromCode, get pendingImport() { return pendingImport; },
  get cloud() { return cloud; }, hasCfg, getCfg, persistLocalOnly, setCloudStatus, firstRuleHint,
};
