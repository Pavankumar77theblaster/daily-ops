<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Ops">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>Daily Ops</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='4' width='16' height='16' rx='4' transform='rotate(45 12 12)' fill='%238b7cff'/%3E%3C/svg%3E">
<!--
  ═══════════════════════════════════════════════════════════════════
  DAILY OPS — single-file daily tracker
  ═══════════════════════════════════════════════════════════════════
  Everything lives in this one file. No build step, no dependencies,
  works offline, data in localStorage (key: dailyops.v1).

  File map:
    1. CSS        — design tokens first (:root), then components.
    2. HTML shell — three mount points: #app (views), #overlays, #toasts.
    3. JS         — sections in order:
         [utils] [state & storage] [day generation & stats] [markdown]
         [toasts & undo] [icons] [views: calendar / day / settings]
         [overlays: search / help] [events] [keyboard] [init]

  Common tweaks:
    • Default routine / categories / links → seed() in JS (only used on
      first run; after that, edit everything in Settings inside the app).
    • Colours → :root tokens below. The accent is set from Settings at
      runtime via the --accent custom property.
  ═══════════════════════════════════════════════════════════════════
-->
<style>
/* ── 1. Design tokens ─────────────────────────────────────────── */
:root{
  /* surfaces — deep ink-blue, not pure black */
  --ink:#0b0e14;        /* page background            */
  --panel:#121620;      /* cards                      */
  --raised:#1a2030;     /* inputs, hover, chips       */
  --line:#242b3c;       /* default borders            */
  --line2:#333c52;      /* stronger borders / tracks  */

  /* text */
  --tx:#e8ebf4;
  --tx2:#9aa3b8;
  --tx3:#657089;

  /* accent — user-swappable at runtime (Settings → Appearance) */
  --accent:#8b7cff;
  --accent-soft:color-mix(in oklab, var(--accent) 16%, transparent);
  --accent-line:color-mix(in oklab, var(--accent) 45%, transparent);

  /* semantic status — fixed on purpose so meaning never shifts */
  --ok:#3dd68c;         /* done        */
  --info:#4da3ff;       /* in progress */
  --warn:#f5a83c;       /* overdue     */
  --bad:#f4707a;        /* destructive */

  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;

  --r:12px; --r-sm:8px;
  --sh:0 10px 30px rgba(0,0,0,.35);
  --fast:140ms cubic-bezier(.2,.7,.3,1);
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* ── 2. Base ──────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{
  background:var(--ink) fixed;
  background-image:none;
  color:var(--tx); font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased; min-height:100dvh;
}
::selection{background:var(--accent-soft)}
a{color:var(--accent);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{
  font:inherit;color:var(--tx);background:var(--raised);
  border:1px solid var(--line2);border-radius:var(--r-sm);
  padding:8px 10px;outline:none;transition:border-color var(--fast);
}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=time],input[type=date]{font-family:var(--mono);font-size:13px}
input[type=color]{padding:2px;width:36px;height:32px;cursor:pointer;background:var(--raised)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.app-max{max-width:1060px;margin:0 auto;padding:20px 18px 60px}
@media(max-width:640px){.app-max{padding:12px 10px 48px}}

/* micro eyebrow labels — part of the instrument-panel voice */
.eyebrow{
  font:600 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  color:var(--tx3);
}

/* ── 3. Buttons & chips ───────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:var(--r-sm);
  border:1px solid var(--line2);background:var(--raised);
  font-weight:500;font-size:13.5px;transition:border-color var(--fast),background var(--fast),transform var(--fast);
  white-space:nowrap;
}
.btn:hover{border-color:var(--accent-line)}
.btn:active{transform:translateY(1px)}
.btn-acc{background:var(--accent);border-color:var(--accent);color:#0b0e14;font-weight:600}
.btn-acc:hover{filter:brightness(1.08)}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn-danger:hover{border-color:var(--bad);color:var(--bad)}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:var(--r-sm);color:var(--tx2);
  border:1px solid transparent;transition:color var(--fast),border-color var(--fast),background var(--fast);
}
.icon-btn:hover{color:var(--tx);background:var(--raised);border-color:var(--line2)}
.icon-btn svg{width:17px;height:17px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:500;
  background:var(--raised);border:1px solid var(--line2);color:var(--tx2);
  transition:border-color var(--fast),color var(--fast);
}
.chip:hover{border-color:var(--accent-line);color:var(--tx)}
.chip svg{width:12px;height:12px;opacity:.7}

/* ── 4. Cards ─────────────────────────────────────────────────── */
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:18px 20px;
}
@media(max-width:640px){.card{padding:14px 14px}}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.count{font:500 12px var(--mono);color:var(--tx3)}

/* ── 5. Top bar ───────────────────────────────────────────────── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16.5px;letter-spacing:-.01em}
.brand-gem{width:14px;height:14px;border-radius:4px;background:var(--accent);transform:rotate(45deg);box-shadow:0 0 14px var(--accent-line)}
.brand small{font:500 11px var(--mono);color:var(--tx3);letter-spacing:.08em;margin-left:2px}
.tb-actions{display:flex;gap:4px}

/* ── 6. Stats strip ───────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat-val{font:600 22px/1.1 var(--mono);letter-spacing:-.02em}
.stat-val small{font-size:13px;color:var(--tx3);font-weight:500}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:3px}
.bar-fill{height:100%;border-radius:99px;background:var(--accent);transition:width .3s ease}
.cpts-edit{cursor:pointer;border-radius:4px}
.cpts-edit:hover{color:var(--accent)}
.cpts-input{width:74px;padding:2px 8px;font:600 18px var(--mono)}
@media(max-width:640px){
  .stats{gap:7px}
  .stat{padding:10px 11px}
  .stat-val{font-size:17px}
  .eyebrow{font-size:9.5px}
}

/* ── 7. Calendar ──────────────────────────────────────────────── */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cal-title{font:600 19px/1 var(--sans);letter-spacing:-.01em}
.cal-title .mono{color:var(--tx3);font-size:15px;font-weight:500}
.cal-nav{display:flex;gap:4px;align-items:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dow{text-align:center;padding:2px 0 8px}
.dow.wkend{opacity:.45}
.cell{
  position:relative;aspect-ratio:.95;border-radius:10px;
  background:var(--raised);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:6px 2px;cursor:pointer;
  transition:border-color var(--fast),background var(--fast),transform var(--fast);
}
.cell:hover{border-color:var(--line2);transform:translateY(-1px)}
.cell-blank{background:transparent;border-color:transparent;cursor:default;pointer-events:none}
.cell-off{background:transparent;border-style:dashed;border-color:var(--line);cursor:default;pointer-events:none}
.cell-off .cell-date{color:var(--tx3);opacity:.55}
.cell-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 18px -4px var(--accent-line)}
.cell-date{font:500 12.5px var(--mono);color:var(--tx2);line-height:1}
.cell-today .cell-date{color:var(--accent);font-weight:700}
.cell-frac{font:500 10px var(--mono);color:var(--tx3);line-height:1}
.ring{display:block}
.ring-track{stroke:var(--line2);fill:none}
.ring-val{fill:none;stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .3s ease}
.st-done{color:var(--ok)} .st-part{color:var(--info)}
.st-todo{color:var(--tx3)} .st-over{color:var(--warn)}
.planned-dot{
  position:absolute;bottom:5px;display:flex;align-items:center;gap:3px;
  font:600 9px var(--mono);color:var(--accent);
}
.planned-dot::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.hint{margin-top:16px;text-align:center;font-size:12.5px;color:var(--tx3)}
.hint .kbd{margin:0 2px}
@media(max-width:640px){
  .cal-grid{gap:4px}
  .cell{border-radius:8px;gap:3px;aspect-ratio:.82}
  .cell-frac{display:none}
  .planned-dot{bottom:3px}
  .planned-dot span{display:none}
}

/* ── 8. Day page ──────────────────────────────────────────────── */
.day-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.day-title{font:650 21px/1.2 var(--sans);letter-spacing:-.015em}
.day-title .mono{color:var(--tx3);font-weight:500;font-size:16px}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;border:1px solid;
}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-done{color:var(--ok);border-color:color-mix(in oklab,var(--ok) 40%,transparent);background:color-mix(in oklab,var(--ok) 10%,transparent)}
.pill-part{color:var(--info);border-color:color-mix(in oklab,var(--info) 40%,transparent);background:color-mix(in oklab,var(--info) 10%,transparent)}
.pill-todo{color:var(--tx3);border-color:var(--line2);background:var(--raised)}
.pill-over{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 40%,transparent);background:color-mix(in oklab,var(--warn) 10%,transparent)}
.day-sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.spacer{flex:1}
.day-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.day-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.day-side{display:flex;flex-direction:column;gap:14px}
@media(max-width:860px){.day-grid{grid-template-columns:1fr}.day-side{order:2}}

/* progress bar inside routine card */
.routine-progress{display:flex;align-items:center;gap:10px;margin-top:14px}
.routine-progress .bar{flex:1;margin:0}

/* ── 9. Task rows ─────────────────────────────────────────────── */
.task-list{display:flex;flex-direction:column}
.task{
  display:flex;align-items:center;gap:11px;
  min-height:46px;padding:7px 6px;border-radius:var(--r-sm);
  border-bottom:1px solid var(--line);
  transition:background var(--fast),opacity var(--fast);
}
.task:last-child{border-bottom:0}
.task:hover{background:var(--raised)}
.task.dragging{opacity:.45;background:var(--raised);border-radius:var(--r-sm)}
.grip{
  color:var(--tx3);cursor:grab;touch-action:none;padding:6px 2px;
  opacity:0;transition:opacity var(--fast);display:flex;flex:none;
}
.grip svg{width:13px;height:13px}
.task:hover .grip,.task:focus-within .grip{opacity:.8}
@media(pointer:coarse){.grip{opacity:.5}}
.cb{
  flex:none;width:21px;height:21px;border-radius:7px;
  border:1.5px solid var(--line2);background:transparent;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--fast),border-color var(--fast);
}
.cb svg{width:12px;height:12px;stroke:#0b0e14;stroke-width:3;opacity:0;transition:opacity var(--fast)}
.task.done .cb{background:var(--ok);border-color:var(--ok)}
.task.done .cb svg{opacity:1}
.t-time{flex:none;font:500 12.5px var(--mono);color:var(--tx3);min-width:44px}
.t-title{flex:1;min-width:0;font-size:14.5px;overflow-wrap:anywhere;transition:color var(--fast)}
.task.done .t-title{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--line2);text-decoration-thickness:1px}
.t-cat{flex:none;width:8px;height:8px;border-radius:50%}
.t-actions{display:flex;flex:none;opacity:0;transition:opacity var(--fast)}
.task:hover .t-actions,.task:focus-within .t-actions{opacity:1}
@media(pointer:coarse){.t-actions{opacity:.7}}
.t-actions .icon-btn{width:30px;height:30px}
.t-actions .icon-btn svg{width:14px;height:14px}

/* inline task editor */
.task-edit{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 8px;border-radius:var(--r-sm);
  background:var(--raised);border:1px solid var(--accent-line);margin:4px 0;
}
.task-edit input[type=text]{flex:1;min-width:150px}
.task-edit select{max-width:140px}

/* add rows */
.add-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.add-row input[type=text]{flex:1;min-width:150px}
.empty{padding:14px 4px;color:var(--tx3);font-size:13.5px}

/* planned (extra) tasks look intentionally different: accent spine, no border rows */
.extra-card{border-left:3px solid var(--accent)}
.extra-card .task{border-bottom-color:transparent}
.extra-card .task + .task{border-top:1px dashed var(--line)}

/* ── 10. Notes ────────────────────────────────────────────────── */
.notes-tabs{display:flex;gap:2px;background:var(--raised);border:1px solid var(--line2);border-radius:var(--r-sm);padding:2px}
.tab{padding:4px 12px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--tx2)}
.tab-on{background:var(--panel);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.md-toolbar{display:flex;gap:2px;margin-bottom:8px}
.md-toolbar .icon-btn{width:30px;height:30px;font:600 12.5px var(--mono)}
.notes-ta{
  width:100%;min-height:190px;resize:none;overflow:hidden;
  font:13.5px/1.65 var(--mono);padding:12px;
  background:var(--ink);border-color:var(--line);
}
.saved-flag{font:500 11px var(--mono);color:var(--ok);opacity:0;transition:opacity .4s}
.saved-flag.show{opacity:1}
.md-view{font-size:14px;line-height:1.65;padding:4px 2px;min-height:100px}
.md-view .md-p{margin:0 0 10px}
.md-view .md-h4,.md-view .md-h5,.md-view .md-h6{margin:14px 0 6px;letter-spacing:-.01em}
.md-view .md-ul,.md-view .md-ol{margin:0 0 10px;padding-left:22px}
.md-view li{margin:3px 0}
.md-view .md-code{font:12.5px var(--mono);background:var(--raised);border:1px solid var(--line2);border-radius:5px;padding:1.5px 6px}
.md-view .md-pre{background:var(--ink);border:1px solid var(--line2);border-radius:var(--r-sm);padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.md-view .md-pre code{font:12.5px/1.6 var(--mono)}
.md-empty{color:var(--tx3)}

/* ── 11. Carry forward ────────────────────────────────────────── */
.carry-item{display:flex;align-items:flex-start;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
.carry-item:last-child{border-bottom:0}
.carry-text{flex:1;font-size:13.5px;overflow-wrap:anywhere;padding-top:3px}
.carry-move-row{display:flex;gap:6px;margin:6px 0 8px;align-items:center;flex-wrap:wrap}

/* ── 12. Settings ─────────────────────────────────────────────── */
.set-grid{display:flex;flex-direction:column;gap:14px;max-width:760px}
.swatches{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.swatch{width:34px;height:34px;border-radius:10px;border:2px solid transparent;transition:transform var(--fast),border-color var(--fast)}
.swatch:hover{transform:scale(1.1)}
.swatch-on{border-color:var(--tx);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--tx)}
.tpl-row,.cat-row,.link-row{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 6px;border-bottom:1px solid var(--line);
}
.tpl-row:last-of-type,.cat-row:last-of-type,.link-row:last-of-type{border-bottom:0}
.tpl-row input[type=text]{flex:1;min-width:140px}
.link-row input[type=text]{min-width:110px}
.link-row input[type=url]{flex:1;min-width:170px}
.cat-row input[type=text]{flex:1;min-width:120px}
.daychips{display:flex;gap:3px}
.dchip{
  width:28px;height:28px;border-radius:7px;font:600 11px var(--mono);
  border:1px solid var(--line2);color:var(--tx3);
  display:flex;align-items:center;justify-content:center;
  transition:background var(--fast),color var(--fast),border-color var(--fast);
}
.dchip-on{background:var(--accent);border-color:var(--accent);color:#0b0e14}
.note-dim{font-size:12.5px;color:var(--tx3);margin-top:10px;line-height:1.5}
.data-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ── 13. Overlays (search / help) ─────────────────────────────── */
.ov{
  position:fixed;inset:0;z-index:50;
  background:rgba(6,8,12,.66);backdrop-filter:blur(3px);
  display:flex;align-items:flex-start;justify-content:center;
  padding:9vh 14px 20px;animation:fade .12s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov-panel{
  width:100%;max-width:600px;background:var(--panel);
  border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh);
  overflow:hidden;animation:pop .14s cubic-bezier(.2,.7,.3,1);
}
@keyframes pop{from{transform:translateY(8px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.search-input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:16px 18px;font-size:15px}
.s-res{max-height:56vh;overflow-y:auto;padding:6px}
.s-item{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:var(--r-sm);transition:background var(--fast)}
.s-item:hover,.s-item-on{background:var(--raised)}
.s-top{display:flex;gap:8px;align-items:center;margin-bottom:3px}
.s-date{font:600 12px var(--mono);color:var(--accent)}
.s-where{font:500 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.s-snip{font-size:13px;color:var(--tx2);overflow-wrap:anywhere}
.s-snip mark{background:var(--accent-soft);color:var(--tx);border-radius:3px;padding:0 2px}
.s-none{padding:20px;text-align:center;color:var(--tx3);font-size:13.5px}
.help-body{padding:18px 20px 22px}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px;margin-top:12px}
@media(max-width:560px){.help-grid{grid-template-columns:1fr}}
.help-row{display:flex;justify-content:space-between;gap:14px;font-size:13px;color:var(--tx2);padding:4px 0}
.kbd{
  font:600 11px var(--mono);color:var(--tx);
  background:var(--raised);border:1px solid var(--line2);border-bottom-width:2px;
  border-radius:5px;padding:2px 7px;white-space:nowrap;
}

/* ── 14. Toasts ───────────────────────────────────────────────── */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{
  display:flex;align-items:center;gap:12px;
  background:var(--raised);border:1px solid var(--line2);border-radius:10px;
  padding:10px 16px;font-size:13.5px;box-shadow:var(--sh);
  animation:pop .15s cubic-bezier(.2,.7,.3,1);max-width:92vw;
}
.toast-undo{color:var(--accent);font-weight:600;flex:none}
.toast-undo:hover{text-decoration:underline}

/* ── 14b. v2 — today strip, stats page, EOD, pull-in ──────────── */
.today-strip{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 16px;margin:0 0 18px;cursor:pointer;box-shadow:var(--sh);
  font-family:var(--sans);transition:border-color .12s ease,transform .12s ease;
}
.today-strip:hover{border-color:var(--line2);transform:translateY(-1px)}
.ts-label{flex:none}
.ts-frac{color:var(--tx2);font-size:12.5px}
.ts-main{flex:1;min-width:0;font-size:14px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-done .ts-main{color:var(--ok)}
.ts-go{color:var(--tx3);display:flex}
.ts-go svg{width:16px;height:16px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.heat{display:flex;gap:4px;overflow-x:auto;padding:6px 2px 10px}
.heat-col{display:flex;flex-direction:column;gap:4px}
.heat-labels{margin-right:4px}
.heat-lab{height:15px;display:flex;align-items:center;font-size:9px}
.heat-cell{width:15px;height:15px;border-radius:4px;border:1px solid var(--line);background:var(--raised);padding:0;cursor:pointer;flex:none;transition:transform .1s ease}
.heat-cell:hover{transform:scale(1.3);border-color:var(--line2)}
.heat-cell:disabled{opacity:.22;cursor:default;transform:none}
.hc-done{background:var(--ok);border-color:var(--ok)}
.hc-part{background:color-mix(in oklab,var(--info) 55%,var(--raised));border-color:transparent}
.hc-over{background:color-mix(in oklab,var(--warn) 45%,var(--raised));border-color:transparent}
.hc-today{outline:2px solid var(--accent);outline-offset:1px}
.heat-legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:11.5px;color:var(--tx3);padding:2px}
.heat-key{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

.catbar{display:flex;align-items:center;gap:10px;padding:7px 0}
.cb-dot{width:9px;height:9px;border-radius:50%;flex:none}
.cb-lab{width:150px;flex:none;font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-track{flex:1;height:7px;border-radius:99px;background:var(--raised);overflow:hidden}
.cb-fill{display:block;height:100%;border-radius:99px}
.cb-n{color:var(--tx3);font-size:12px;width:30px;text-align:right;flex:none}

.eod-panel{padding:16px}
.eod-ta{width:100%;margin-top:10px}
.pull-banner{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
  background:color-mix(in oklab,var(--warn) 9%,transparent);
  border:1px dashed color-mix(in oklab,var(--warn) 45%,transparent);
  color:var(--warn);border-radius:var(--r-sm);padding:9px 12px;
  font-size:13px;font-family:var(--sans);margin-bottom:12px;
}
.pull-banner:hover{background:color-mix(in oklab,var(--warn) 15%,transparent)}
.pull-banner svg{width:15px;height:15px;flex:none}
.icon-btn.on{color:var(--accent);background:var(--accent-soft)}
.tb-gear{position:relative}
.dot-warn{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--panel)}
.s-cmd .s-where{color:var(--accent)}
@keyframes glowPulse{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.pill-pulse{animation:glowPulse .9s ease-out 2}

/* automatic backup file */
.bk-box{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-top:12px;background:var(--ink)}
.bk-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bk-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--tx3)}
.bk-dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in oklab,var(--ok) 22%,transparent)}
.bk-dot.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in oklab,var(--warn) 22%,transparent)}
.bk-name{font-size:13px;color:var(--tx);flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-name .mono{color:var(--tx2)}
.reconnect{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:color-mix(in oklab,var(--info) 10%,transparent);
  border:1px solid color-mix(in oklab,var(--info) 45%,transparent);
  color:var(--info);border-radius:var(--r-sm);padding:10px 14px;
  font-size:13px;font-family:var(--sans);margin-bottom:14px;
}
.reconnect:hover{background:color-mix(in oklab,var(--info) 16%,transparent)}
.reconnect svg{width:16px;height:16px;flex:none}
.reconnect .spacer{flex:1}
@media (max-width:720px){ .tiles{grid-template-columns:repeat(2,1fr)} .cb-lab{width:96px} }

/* ── 14c. v3 — design refresh ─────────────────────────────────── */
:root{ --display:'Space Grotesk',var(--sans); }
body{background:var(--ink);}
.app-max{position:relative;z-index:1}
.brand,.cal-title,.day-title,.stat-val{font-family:var(--display);letter-spacing:-.01em}
.card{background:linear-gradient(180deg, color-mix(in oklab, #fff 2.5%, var(--panel)), var(--panel));
  border-color:color-mix(in oklab, #fff 5%, var(--line));}
.ring circle{stroke-linecap:round}
.cell-today{box-shadow:0 0 0 1px var(--accent-line), 0 10px 26px -14px color-mix(in oklab, var(--accent) 55%, transparent)}
.btn-acc{background-image:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0))}
::selection{background:color-mix(in oklab, var(--accent) 32%, transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2px solid var(--ink)}
*::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* now marker — the task the clock says you should be on */
.task.t-now{border-color:var(--accent-line);background:color-mix(in oklab, var(--accent) 7%, transparent)}
.task.t-now::after{content:'now';font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  color:var(--accent);border:1px solid var(--accent-line);border-radius:99px;padding:2px 7px;margin-left:8px;flex:none}

/* day off */
.cell-dayoff .ring{opacity:.25}
.cell-dayoff{background:repeating-linear-gradient(-45deg, transparent 0 7px, color-mix(in oklab, var(--tx3) 9%, transparent) 7px 8px)}
.off-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;color:var(--tx3);
  border:1px solid var(--line2);border-radius:99px;padding:1px 6px;text-transform:uppercase}
.hc-offday{background:repeating-linear-gradient(-45deg, var(--raised) 0 4px, var(--panel) 4px 6px);border-color:var(--line)}
.off-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px}
.off-card h2{font-family:var(--display);font-size:19px;margin:0;color:var(--tx)}
.pill-off{color:var(--tx3);border-color:var(--line2);background:transparent}

/* eod nudge bar (amber cousin of .reconnect) */
.nudgebar{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:color-mix(in oklab, var(--warn) 10%, transparent);
  border:1px solid color-mix(in oklab, var(--warn) 45%, transparent);
  color:var(--warn);border-radius:var(--r-sm);padding:10px 14px;
  font-size:13px;font-family:var(--sans);margin-bottom:14px;
}
.nudgebar .spacer{flex:1}
.nudgebar .btn{flex:none}

/* week view */
.week-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
.wk-col{background:linear-gradient(180deg, color-mix(in oklab, #fff 2.5%, var(--panel)), var(--panel));
  border:1px solid color-mix(in oklab, #fff 5%, var(--line));border-radius:var(--r);padding:12px;min-width:0}
.wk-col.wk-today{border-color:var(--accent-line);box-shadow:0 10px 26px -16px color-mix(in oklab, var(--accent) 45%, transparent)}
.wk-col.wk-off{opacity:.6}
.wk-day{display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;background:none;border:none;
  padding:2px 2px 10px;color:var(--tx)}
.wk-day:hover .wk-num{color:var(--accent)}
.wk-name{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3)}
.wk-num{font-family:var(--display);font-size:19px;font-weight:600;line-height:1}
.wk-count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--tx3)}
.wk-task{display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;background:none;
  border:none;border-radius:7px;padding:6px 6px;color:var(--tx2);font-size:12.5px;line-height:1.35}
.wk-task:hover{background:var(--raised)}
.wk-task .wk-tick{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2);flex:none;
  display:flex;align-items:center;justify-content:center;color:transparent}
.wk-task .wk-tick svg{width:9px;height:9px}
.wk-task.done{color:var(--tx3);text-decoration:line-through}
.wk-task.done .wk-tick{background:var(--ok);border-color:var(--ok);color:#08110c}
.wk-task.wk-extra .wk-tick{border-radius:4px}
.wk-sep{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);
  margin:8px 2px 3px;opacity:.85}
.wk-ghost{font-size:12px;color:var(--tx3);padding:4px 2px}
.wk-more{font-size:11.5px;color:var(--tx3);padding:4px 6px}
.wk-notes{margin-top:8px;font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:5px}
.wk-notes svg{width:11px;height:11px}
@media (max-width:900px){.week-grid{grid-template-columns:repeat(5,minmax(150px,1fr));overflow-x:auto;padding-bottom:6px}}

/* bottom tab bar — phones only */
.tabbar{display:none}
@media (max-width:720px){
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;
    padding:6px max(8px, env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-right));
    background:color-mix(in oklab, var(--ink) 82%, transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);}
  .tab-i{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;
    color:var(--tx3);font-family:var(--sans);font-size:10px;letter-spacing:.02em;padding:4px 10px;border-radius:10px}
  .tab-i svg{width:19px;height:19px}
  body[data-view=cal]   .tab-i[data-view=cal],
  body[data-view=week]  .tab-i[data-view=week],
  body[data-view=day]   .tab-i[data-view=day],
  body[data-view=stats] .tab-i[data-view=stats],
  body[data-view=set]   .tab-i[data-view=set]{color:var(--accent)}
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
}

/* ── 14d. v4 — typography system & professional polish ────────── */
:root{
  --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
  --display:'Sora',var(--sans);
}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{font-size:14px;letter-spacing:.005em}
.brand,.cal-title,.day-title,.stat-val,.wk-num,.off-card h2{font-family:var(--display);letter-spacing:-.015em}
.stat-val,.count,.cell-frac,.wk-count,.mono,.ts-frac,.cb-n,.bk-name .mono,
input[type=time],input[type=date]{font-variant-numeric:tabular-nums}
.eyebrow{letter-spacing:.16em;font-weight:600}

/* sticky, glassed topbar */
.topbar{position:sticky;top:0;z-index:35;margin:0 -6px 18px;padding:10px 6px;
  background:color-mix(in oklab, var(--ink) 78%, transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid color-mix(in oklab, var(--line) 70%, transparent)}

/* consistent focus & interaction states */
:is(button,[role=button],input,select,textarea,a,[tabindex="0"]):focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
input,textarea,select{caret-color:var(--accent)}
input:focus,textarea:focus,select:focus{border-color:var(--accent-line)}
.btn{transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -10px rgba(0,0,0,.6)}
.btn:active{transform:translateY(0);box-shadow:none}
.icon-btn{transition:background .12s ease, color .12s ease, transform .12s ease}
.icon-btn:active{transform:scale(.94)}

/* structure: hairline under card headers, refined empties & kbd */
.card-h{border-bottom:1px solid color-mix(in oklab, var(--line) 80%, transparent);
  padding-bottom:11px;margin-bottom:13px}
.empty{border:1px dashed color-mix(in oklab, var(--line2) 80%, transparent);
  border-radius:var(--r-sm);padding:18px 14px;text-align:center;font-size:13px}
.kbd{border-radius:6px;box-shadow:0 1px 0 color-mix(in oklab,#000 35%,transparent)}
.hint{letter-spacing:.01em}

/* calendar & rows */
.cell{transition:transform .12s ease, border-color .12s ease, background .12s ease}
.cell:hover{transform:translateY(-1px)}
.cell-today .cell-date{color:var(--accent);font-weight:600}
.dow{letter-spacing:.16em}
.task{transition:background .12s ease, border-color .12s ease}
.t-time,.task .mono{font-variant-numeric:tabular-nums}

/* overlays & toasts get depth */
.ov{background:rgba(5,8,14,.68);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.toast{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  background:color-mix(in oklab, var(--panel) 88%, transparent);
  border-color:color-mix(in oklab, #fff 8%, var(--line))}

/* motion & scrolling niceties */
@media (prefers-reduced-motion: no-preference){ html{scroll-behavior:smooth} }
.week-grid{overscroll-behavior-x:contain}
.tab-i{font-family:var(--sans);font-weight:500}
@media (max-width:720px){ .topbar{margin:0 -2px 16px;padding:10px 2px} }

/* ── 14e. v5 — iPhone fit, simpler settings, per-task colours ─── */
@media (max-width:720px){
  html,body{overflow-x:clip}
  input,select,textarea{font-size:16px}          /* stops iOS focus-zoom */
  .app-max{padding-top:calc(4px + env(safe-area-inset-top))}
  .topbar{top:0;padding-top:calc(10px + env(safe-area-inset-top))}
  .day-head{flex-wrap:wrap;row-gap:8px}
  .day-title{font-size:19px}
  .add-row{flex-wrap:wrap}
  .add-row input[type=text]{flex:1 1 100%;min-width:0}
  .add-row input[type=time],.add-row input[type=date]{flex:1 1 auto;min-width:0}
  .add-row .btn{flex:1 1 auto;justify-content:center}
  .stats{gap:8px}
  .stat{padding:10px}
  .stat-val{font-size:19px}
  .icon-btn{min-width:40px;min-height:40px}
  .cell{padding:6px 4px}
  .cell-frac{font-size:10px}
  .cal-grid{gap:5px}
  .week-head{flex-wrap:wrap;row-gap:8px}
  .ov-panel{width:94vw;max-height:82dvh;overflow:auto}
  .t-actions .icon-btn{opacity:1}                /* touch: controls always visible */
  .heat-cell{width:13px;height:13px}
  .heat-lab{height:13px}
}

/* simpler settings: routine rows collapse to one line, expand to edit */
.tpl-sum{display:flex;align-items:center;gap:6px}
.tpl-openbtn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;
  background:none;border:1px solid transparent;border-radius:var(--r-sm);
  padding:9px 10px;cursor:pointer;color:var(--tx);font-family:var(--sans)}
.tpl-openbtn:hover{background:var(--raised);border-color:var(--line)}
.tpl-openbtn > svg{width:14px;height:14px;color:var(--tx3);flex:none;margin-left:auto}
.t-dot{width:9px;height:9px;border-radius:50%;flex:none}
.tpl-t{color:var(--tx2);font-size:12.5px;flex:none;width:50px}
.tpl-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}
.tpl-days{color:var(--tx3);font-size:11px;letter-spacing:.18em;flex:none}
.tpl-editor{align-items:flex-start;background:var(--ink);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:10px;display:flex;gap:6px}
.tpl-fields{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.tpl-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tpl-line input[type=text]{flex:1;min-width:140px}

/* own-colour control (tasks & routine) */
.clr-wrap{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--tx2);
  cursor:pointer;user-select:none;white-space:nowrap}
.clr-wrap input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
.clr-wrap input[type=color]{width:30px;height:24px;padding:0;border:1px solid var(--line2);
  border-radius:6px;background:none;cursor:pointer}
.clr-wrap input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.clr-wrap input[type=color]::-webkit-color-swatch{border:none;border-radius:4px}

/* ── 14f. v6 — cloud login & sync status ──────────────────────── */
.cloud-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--raised);border-radius:99px;padding:4px 10px;font-size:11.5px;color:var(--tx2);
  cursor:pointer;font-family:var(--sans);white-space:nowrap}
.cloud-pill:hover{border-color:var(--line2)}
.cloud-pill .cp-dot{width:7px;height:7px;border-radius:50%;background:var(--tx3);flex:none}
.cloud-pill.on .cp-dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in oklab,var(--ok) 22%,transparent)}
.cloud-pill.syncing .cp-dot{background:var(--info);animation:cpPulse 1s ease-in-out infinite}
.cloud-pill.err .cp-dot{background:var(--warn)}
@keyframes cpPulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (max-width:720px){ .cloud-pill .cp-txt{display:none} .cloud-pill{padding:6px} }
.auth-tabs{display:flex;gap:6px;margin-bottom:14px}
.auth-tab{flex:1;padding:9px;border:1px solid var(--line);background:var(--raised);color:var(--tx2);
  border-radius:var(--r-sm);cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:500}
.auth-tab.on{background:var(--accent);border-color:var(--accent);color:#0b0e14}
.auth-field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.auth-field label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.auth-field input{width:100%}
.auth-err{color:var(--warn);font-size:12.5px;margin:0 0 12px;min-height:16px}
.auth-note{font-size:12px;color:var(--tx3);line-height:1.5;margin-top:12px}
.cfg-ta{width:100%;min-height:120px;font-size:12px}
.acct-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.acct-email{font-family:var(--mono);font-size:12.5px;color:var(--tx);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── 14g. v7 — professional refinement pass ───────────────────── */
:root{
  --sh:0 1px 2px rgba(0,0,0,.28), 0 8px 24px -14px rgba(0,0,0,.55);
  --sh-lg:0 2px 6px rgba(0,0,0,.32), 0 20px 48px -20px rgba(0,0,0,.7);
}
/* one signature: a fine luminous hairline at the very top edge, like a
   powered-on instrument. Quiet, present, unmistakably "on". */
.app-max::before{content:'';position:fixed;top:0;left:0;right:0;height:1px;z-index:60;pointer-events:none;
  background:linear-gradient(90deg, transparent, color-mix(in oklab,var(--accent) 70%,transparent) 22%, color-mix(in oklab,var(--accent) 70%,transparent) 78%, transparent);
  opacity:.55}

/* brand: the diamond gets a subtle inner cut, matching the app icon */
.brand-gem{position:relative;background:linear-gradient(145deg, color-mix(in oklab,var(--accent) 116%,#fff 8%), var(--accent))}
.brand-gem::after{content:'';position:absolute;inset:4px;border-radius:1px;background:var(--ink);transform:none}
.brand small{opacity:.85}

/* cards: crisper elevation, calmer borders, a hair more breathing room */
.card{box-shadow:var(--sh);border-radius:14px}
.card + .card{margin-top:16px}
.stat{border-radius:12px;box-shadow:var(--sh)}

/* buttons: quieter default, confident accent, real press feedback */
.btn{border-radius:9px;font-weight:550;letter-spacing:.005em}
.btn-acc{box-shadow:0 1px 0 rgba(255,255,255,.14) inset, 0 6px 16px -10px color-mix(in oklab,var(--accent) 70%,transparent)}

/* inputs: unified, tactile, with a clear focused state */

/* toasts: elevated, with an icon slot; the sync variant reads as calm-positive */

/* pills & chips: consistent radius language */
.pill,.chip,.kbd,.count,.off-tag,.cloud-pill{border-radius:99px}
.pill{font-weight:600;letter-spacing:.01em}

/* calendar: today ring stands out; hover lifts with a soft shadow */
.cell{border-radius:11px}
.cell:hover{box-shadow:var(--sh)}
.cell-today{box-shadow:0 0 0 1px var(--accent-line), 0 8px 22px -14px color-mix(in oklab,var(--accent) 60%,transparent)}

/* section rhythm: eyebrow labels get a touch more presence */
.eyebrow{color:var(--tx2)}

/* the day "instrument" progress bar — thinner, precise, tabular */
.bar{height:6px;border-radius:99px;background:var(--raised);overflow:hidden}
.bar-fill{border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}

/* nav clarity: a subtle divider only where structure needs it */
.day-sub{border-bottom:1px solid color-mix(in oklab,var(--line) 60%,transparent);padding-bottom:12px;margin-bottom:16px}

/* focus-visible everywhere, crisp and on-brand */
:is(button,[role=button],a,input,select,textarea,[tabindex="0"]):focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:720px){
  .card{border-radius:13px}
  .app-max::before{opacity:.4}

}

/* ── 14h. v9 — minimal: flat & calm, no decoration ───────────── */
:root{
  --sh:none; --sh-lg:none;
}
/* kill every gradient / glow / texture background across the app */
body{background:var(--ink) !important;background-image:none !important}
body::before{display:none !important}
.app-max::before{display:none !important}        /* the luminous top hairline */
.card,.stat,.wk-col,.off-card{background:var(--panel) !important;background-image:none !important}
.btn-acc{background:var(--accent) !important;background-image:none !important}
.brand-gem{background:var(--accent) !important;background-image:none !important}
.today-strip,.pull-banner,.reconnect,.nudgebar,.toast,.toast-sync,.bk-box,
.auth-tab.on,.cloud-pill{background-image:none !important}

/* flat surfaces: borders define structure, not shadows */
.card,.stat,.wk-col,.ov-panel,.toast,.cell,.bk-box,.off-card{box-shadow:none !important}
.cell:hover,.card:hover,.btn:hover,.btn-acc:hover{box-shadow:none !important}
.cell-today{box-shadow:none !important;border-color:var(--accent) !important}
.btn-acc{box-shadow:none !important}
input:focus,select:focus,textarea:focus{box-shadow:none !important}

/* remove lift/scale motion; keep only gentle opacity fades for calm */
.btn:hover,.cell:hover,.today-strip:hover{transform:none !important}
.pill-pulse{animation:none !important}
.cloud-pill.syncing .cp-dot{animation:none !important}
.ov-panel,.toast{animation:none !important}

/* calmer borders and a touch more restraint on radii */
:root{ --r:12px; --r-sm:9px; }
.card{border:1px solid var(--line);border-radius:12px}
.card + .card{margin-top:14px}
.stat{border:1px solid var(--line)}
.bar{background:var(--raised)}
.bar-fill{transition:width .3s ease}
hr,.day-sub{border-color:var(--line)}

/* accent used sparingly: focus ring stays (accessibility), everything else quiet */
:is(button,[role=button],a,input,select,textarea,[tabindex="0"]):focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

/* ── 14i. v10 — warm paper theme: calm, light, friendly ───────── */
:root{
  /* warm off-white paper surfaces */
  --ink:#f6f4ef;         /* page — warm paper           */
  --panel:#ffffff;       /* cards — clean white         */
  --raised:#efece5;      /* inputs, hover, chips         */
  --line:#e4e0d7;        /* soft borders                */
  --line2:#d3cec2;       /* stronger borders            */

  /* warm grey ink for text — easy on the eyes */
  --tx:#2b2a26;          /* primary                     */
  --tx2:#6b6860;         /* secondary                   */
  --tx3:#9c988d;         /* muted                       */

  /* calm sage-green accent — friendly, not corporate */
  --accent:#5b8a72;
  --accent-soft:color-mix(in oklab, var(--accent) 12%, transparent);
  --accent-line:color-mix(in oklab, var(--accent) 40%, transparent);

  /* softened semantic status — same meanings, gentler tones */
  --ok:#4f9d6f;          /* done        */
  --info:#4a86c5;        /* in progress */
  --warn:#d99036;        /* overdue     */
  --bad:#cf6b63;         /* destructive */

  --r:14px; --r-sm:10px;
  --sh:none; --sh-lg:none;
}
html,body{background:var(--ink) !important;background-image:none !important;color:var(--tx)}
body::before,.app-max::before{display:none !important}

/* cards: clean white with a soft warm border, generous rounding */
.card,.stat,.wk-col,.off-card{background:var(--panel) !important;background-image:none !important;
  border:1px solid var(--line) !important;box-shadow:none !important;border-radius:14px}
.card + .card{margin-top:14px}

/* inputs: soft, friendly, clearly tappable */
input,select,textarea{background:var(--raised);border:1px solid var(--line);color:var(--tx);border-radius:10px}
input::placeholder,textarea::placeholder{color:var(--tx3)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:none !important}

/* buttons: calm, tactile, obvious */
.btn{background:var(--panel);border:1px solid var(--line2);color:var(--tx);border-radius:10px;box-shadow:none !important}
.btn:hover{background:var(--raised);transform:none !important}
.btn-acc{background:var(--accent) !important;background-image:none !important;border-color:var(--accent) !important;color:#fff !important}
.btn-acc:hover{background:color-mix(in oklab,var(--accent) 88%, #000) !important}
.btn-danger{color:var(--bad);border-color:color-mix(in oklab,var(--bad) 40%,var(--line2))}
.icon-btn{color:var(--tx2);border-radius:10px}
.icon-btn:hover{background:var(--raised);color:var(--tx)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}

/* topbar: paper, subtle divider, no glass/blur */
.topbar{background:color-mix(in oklab,var(--ink) 88%, transparent) !important;
  -webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:1px solid var(--line)}
.brand-gem{background:var(--accent) !important;background-image:none !important}

.brand{color:var(--tx)}

/* calendar: soft cells, clear today, gentle hover */
.cell{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:none !important}
.cell:hover{background:var(--raised);transform:none !important;box-shadow:none !important}
.cell-today{border-color:var(--accent) !important;box-shadow:0 0 0 1px var(--accent) inset !important}
.cell-dayoff{background:repeating-linear-gradient(-45deg, var(--panel) 0 6px, var(--raised) 6px 7px)}
.dow{color:var(--tx3)}

/* pills, chips, tags: soft rounded, quiet */
.pill{border:1px solid var(--line2);background:var(--panel);border-radius:99px;font-weight:600}
.pill-done{color:var(--ok);border-color:color-mix(in oklab,var(--ok) 35%,var(--line2))}
.pill-part{color:var(--info);border-color:color-mix(in oklab,var(--info) 35%,var(--line2))}
.pill-over{color:var(--warn);border-color:color-mix(in oklab,var(--warn) 35%,var(--line2))}
.kbd{background:var(--raised);border:1px solid var(--line2);color:var(--tx2);box-shadow:none}
.count,.cloud-pill,.off-tag{border-radius:99px}
.cloud-pill{background:var(--panel);border-color:var(--line2);color:var(--tx2)}

/* progress bars: soft track, calm fill */
.bar{background:var(--raised);height:6px;border-radius:99px}

.ring-track{stroke:var(--line)}

/* tasks: airy rows, friendly checkboxes */

/* overlays: soft dim, clean white panel */
.ov{background:rgba(43,42,38,.32);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.ov-panel{background:var(--panel) !important;border:1px solid var(--line);box-shadow:0 12px 40px -12px rgba(43,42,38,.25) !important;border-radius:16px}

/* toasts: clean card, gentle */
.toast{background:var(--panel) !important;border:1px solid var(--line2);color:var(--tx);box-shadow:0 8px 28px -10px rgba(43,42,38,.25) !important;border-radius:12px}
.toast-sync{border-color:var(--accent-line);background:var(--accent-soft) !important}
.toast-sync .toast-ic{color:var(--accent)}

/* banners: soft tinted, no harsh edges */
.today-strip,.bk-box{background:var(--panel) !important;background-image:none !important;border:1px solid var(--line);border-radius:14px;box-shadow:none !important}
.today-strip:hover{background:var(--raised);transform:none !important}
.pull-banner{background:color-mix(in oklab,var(--warn) 10%, var(--panel));border:1px dashed color-mix(in oklab,var(--warn) 40%,transparent);color:color-mix(in oklab,var(--warn) 60%,#000);border-radius:12px}
.nudgebar{background:color-mix(in oklab,var(--warn) 10%, var(--panel));border:1px solid color-mix(in oklab,var(--warn) 35%,transparent);color:color-mix(in oklab,var(--warn) 62%,#000);border-radius:12px}
.reconnect{background:color-mix(in oklab,var(--info) 10%, var(--panel));border:1px solid color-mix(in oklab,var(--info) 35%,transparent);color:color-mix(in oklab,var(--info) 60%,#000);border-radius:12px}

/* week view: soft columns */
.wk-col{background:var(--panel) !important;border:1px solid var(--line) !important}
.wk-col.wk-today{border-color:var(--accent) !important;box-shadow:none !important}
.wk-task:hover{background:var(--raised)}
.wk-task.done .wk-tick{background:var(--accent);border-color:var(--accent);color:#fff}

/* stats heatmap: warm empty → green full */
.heat-cell{background:var(--raised);border:1px solid var(--line)}
.hc-done{background:var(--accent);border-color:var(--accent)}
.hc-part{background:color-mix(in oklab,var(--info) 45%, var(--panel));border-color:transparent}
.hc-over{background:color-mix(in oklab,var(--warn) 42%, var(--panel));border-color:transparent}
.hc-today{outline:2px solid var(--accent)}

/* auth / cloud screens: clean and calm */
.auth-tab{background:var(--raised);border:1px solid var(--line);color:var(--tx2);border-radius:10px}
.auth-tab.on{background:var(--accent) !important;border-color:var(--accent) !important;color:#fff}

/* tab bar (phone): paper, clean */
@media (max-width:720px){
  .tabbar{background:color-mix(in oklab,var(--ink) 92%, transparent) !important;
    -webkit-backdrop-filter:none;backdrop-filter:none;border-top:1px solid var(--line)}
  .tab-i{color:var(--tx3)}
}

/* motion: calm only */
.pill-pulse,.cloud-pill.syncing .cp-dot,.ov-panel,.toast{animation:none !important}
*{transition-duration:.14s}

/* selection + scrollbar match the warm theme */
::selection{background:var(--accent-soft)}
*::-webkit-scrollbar-thumb{background:var(--line2)}
*::-webkit-scrollbar-track{background:transparent}

/* accessible focus ring stays */
:is(button,[role=button],a,input,select,textarea,[tabindex="0"]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 15. Misc ─────────────────────────────────────────────────── */
.banner{
  background:color-mix(in oklab,var(--warn) 12%,transparent);
  border:1px solid color-mix(in oklab,var(--warn) 40%,transparent);
  color:var(--warn);border-radius:var(--r-sm);
  padding:10px 14px;font-size:13px;margin-bottom:14px;display:none;
}
.banner.show{display:block}
.fade-in{animation:fade .16s ease}
</style>

<body>
<div class="app-max">
  <div id="banner" class="banner">⚠ Storage is unavailable in this preview, so changes won't persist. Download the file and open it in your own browser (or host it) for real use.</div>
  <main id="app" aria-live="polite"></main>
  <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
</div>
<div id="overlays"></div>
<div id="toasts"></div>
<input type="file" id="fileImport" accept="application/json,.json" hidden>
<noscript><p style="padding:40px;text-align:center">Daily Ops needs JavaScript to run.</p></noscript>
<script>
'use strict';
/* Appended below: utils → state → day logic → views → events → init */

/* ════════════════════════════════════════════════════════════════
   UTILS
   ════════════════════════════════════════════════════════════════ */
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const debounce = (fn, ms) => { let t; const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; d.now = (...a) => { clearTimeout(t); fn(...a); }; return d; };

/* Dates. Everything keyed by local 'YYYY-MM-DD'. Noon avoids DST edges. */
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const fromYMD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const todayYMD = () => ymd(new Date());
const dowMon1 = s => { const d = fromYMD(s).getDay(); return d === 0 ? 7 : d; };  // Mon=1 … Sun=7
const isWeekday = s => dowMon1(s) <= 5;
const addDays = (s, n) => { const d = fromYMD(s); d.setDate(d.getDate() + n); return ymd(d); };
const prevWeekday = s => { let d = addDays(s, -1); while (!isWeekday(d)) d = addDays(d, -1); return d; };
const nextWeekday = s => { let d = addDays(s, 1); while (!isWeekday(d)) d = addDays(d, 1); return d; };
const fmtLong = s => fromYMD(s).toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
const fmtShort = s => fromYMD(s).toLocaleDateString('en-GB', { weekday: 'short', day: '2-digit', month: 'short' });
const fmtStamp = iso => { try { return new Date(iso).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch { return '—'; } };
const monthLabel = (y, m) => new Date(y, m, 1).toLocaleDateString('en-GB', { month: 'long' }) + ' <span class="mono">' + y + '</span>';
const DAY_LETTERS = ['', 'M', 'T', 'W', 'T', 'F'];
const DAY_NAMES = ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

/* ════════════════════════════════════════════════════════════════
   STATE & STORAGE  —  localStorage key 'dailyops.v1'
   ════════════════════════════════════════════════════════════════ */
const DB_KEY = 'dailyops.v1';
let storageOK = true;
/* Claude artifact storage (async key-value) — present only inside claude.ai
   artifacts, where localStorage is blocked. When it exists we mirror state
   there so the artifact version persists too. Null everywhere else. */
const AS = (typeof window.storage === 'object' && window.storage && typeof window.storage.get === 'function')
  ? window.storage : null;

/* First-run defaults. After first launch these live in localStorage and
   are edited from Settings — this function is never consulted again. */
function seed() {
  const cats = [
    { id: uid(), label: 'Ops',   color: '#38bdf8' },
    { id: uid(), label: 'CPTS',  color: '#a78bfa' },
    { id: uid(), label: 'Admin', color: '#8a93a8' },
  ];
  const [OPS, CPTS, ADMIN] = cats.map(c => c.id);
  const ALL = [1, 2, 3, 4, 5];
  let o = 0;
  const t = (time, title, days, cat) => ({ id: uid(), time, title, days, cat, order: o++ });
  return {
    version: 2,
    settings: {
      accent: '#8b7cff',
      cptsDone: 45, cptsTotal: 495,  // HTB CPTS sections done / total
      hideDone: false,               // hide ticked tasks on day pages
      lastExport: null,              // when the last manual backup was downloaded
      autoBackup: false,             // mirror every change to a linked file
      lastAuto: null,                // when the linked file was last written
      eodAt: '18:25',                // in-app nudge time for the EOD log
      links: [
        { id: uid(), label: 'Keka',     url: 'https://app.keka.com' },
        { id: uid(), label: 'Gmail',    url: 'https://mail.google.com' },
        { id: uid(), label: 'HTB CPTS', url: 'https://enterprise.hackthebox.com/academy-lab/30000/2125/paths/16' },
      ],
    },
    categories: cats,
    templates: [
      t('09:30', 'Clock in — Keka',                              ALL, ADMIN),
      t('09:45', 'Email triage & replies',                       ALL, ADMIN),
      t('10:00', 'Weekly planning — set HTB target',             [1], CPTS),
      t('10:30', 'Core pentest / VAP work',                      ALL, OPS),
      t('11:30', 'Deep execution + evidence capture',            [2], OPS),
      t('11:30', 'Report QA · TORT/DAST-S · Confluence',         [4], OPS),
      t('15:00', 'Network + Active Directory focus',             [3], CPTS),
      t('16:00', 'HTB CPTS lab push',                            ALL, CPTS),
      t('17:00', 'Weekly retro + plan next week',                [5], OPS),
      t('18:00', 'PeerBuddy progress update',                    ALL, OPS),
      t('18:30', 'EOD log + Clock out — Keka',                   ALL, ADMIN),
    ],
    days: {},   // 'YYYY-MM-DD' → { routine:[task], extra:[task], notes:'' }
    carry: [],  // [{ id, text }]
  };
}

/* Coerce any loaded/imported object into a valid state (fills gaps,
   never throws). This is what keeps old backups working after updates. */
function normalize(raw) {
  const base = seed();
  if (!raw || typeof raw !== 'object') return base;
  const s = { ...base, ...raw };
  s.version = 2;
  s.settings = { ...base.settings, ...(raw.settings || {}) };
  /* v1 → v2 migration: the old single CPTS percent becomes done/total */
  if (raw.settings && raw.settings.cptsDone == null && raw.settings.cpts != null) {
    s.settings.cptsDone = clamp(Number(raw.settings.cpts) || 0, 0, 100);
    s.settings.cptsTotal = 100;
  }
  s.settings.cptsTotal = Math.max(1, Math.round(Number(s.settings.cptsTotal) || 1));
  s.settings.cptsDone = clamp(Math.round(Number(s.settings.cptsDone) || 0), 0, s.settings.cptsTotal);
  delete s.settings.cpts;
  s.settings.hideDone = !!s.settings.hideDone;
  if (typeof s.settings.lastExport !== 'string') s.settings.lastExport = null;
  s.settings.autoBackup = !!s.settings.autoBackup;
  if (typeof s.settings.lastAuto !== 'string') s.settings.lastAuto = null;
  if (!/^\d{2}:\d{2}$/.test(s.settings.eodAt || '')) s.settings.eodAt = base.settings.eodAt;
  if (!Array.isArray(s.settings.links)) s.settings.links = base.settings.links;
  if (!Array.isArray(s.categories)) s.categories = base.categories;
  if (!Array.isArray(s.templates)) s.templates = base.templates;
  const okColor = c => (typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c)) ? c : null;
  s.templates.forEach((t, i) => { if (!Array.isArray(t.days)) t.days = [1,2,3,4,5]; if (t.order == null) t.order = i; t.color = okColor(t.color); });
  if (!s.days || typeof s.days !== 'object') s.days = {};
  for (const k of Object.keys(s.days)) {
    const d = s.days[k];
    if (!Array.isArray(d.routine)) d.routine = [];
    if (!Array.isArray(d.extra)) d.extra = [];
    if (typeof d.notes !== 'string') d.notes = '';
    d.off = !!d.off;
    d.routine.forEach(t => { t.color = okColor(t.color); });
    d.extra.forEach(t => { t.color = okColor(t.color); });
  }
  if (!Array.isArray(s.carry)) s.carry = [];
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) return normalize(JSON.parse(raw));
  } catch (e) { storageOK = false; }
  return seed();
}

let S = load();

function persistLocalOnly() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(S)); }
  catch (e) { storageOK = false; $('#banner').classList.add('show'); }
  if (typeof backupSoon === 'function' && bkState === 'linked') backupSoon();
  if (AS && typeof artifactSoon === 'function') artifactSoon();
}
function persist() {
  persistLocalOnly();
  if (cloud.on && !cloud.applying && typeof pushCloudSoon === 'function') pushCloudSoon();
}
const saveSoon = debounce(persist, 350);
function persistArtifact() {
  if (!AS) return;
  try { AS.set(DB_KEY, JSON.stringify(S)).catch(() => {}); } catch (e) {}
}
const artifactSoon = debounce(persistArtifact, 900);

/* ════════════════════════════════════════════════════════════════
   AUTOMATIC BACKUP FILE  (File System Access API + IndexedDB)
   ────────────────────────────────────────────────────────────────
   Link a JSON file once; every change is mirrored to it silently, so a
   cleared cache or a fresh browser can't wipe your history. The file
   handle is kept in IndexedDB so the link survives restarts (the
   browser may ask you to re-grant write access once per session).
   Chromium-only API — everywhere else this stays dormant and manual
   Export / Import remain the path. Nothing here ever leaves the machine.
   ════════════════════════════════════════════════════════════════ */
const FS_OK = typeof window.showSaveFilePicker === 'function';
let bkHandle = null;        // FileSystemFileHandle for the linked file
let bkState = 'off';        // 'off' | 'linked' | 'need-permission'

/* tiny promisified IndexedDB, one store, one row — just holds the handle */
const idb = (() => {
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('dailyops-backup', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode);
      const os = t.objectStore('kv');
      const req = fn(os);
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    get: k => tx('readonly', os => os.get(k)).catch(() => null),
    set: (k, v) => tx('readwrite', os => os.put(v, k)).catch(() => {}),
    del: k => tx('readwrite', os => os.delete(k)).catch(() => {}),
  };
})();

const perm = async (h, mode = 'readwrite') => {
  if (!h.queryPermission) return 'granted';
  try { return await h.queryPermission({ mode }); } catch { return 'denied'; }
};
const askPerm = async (h, mode = 'readwrite') => {
  if (!h.requestPermission) return 'granted';
  try { return await h.requestPermission({ mode }); } catch { return 'denied'; }
};

/* Write the whole state to the linked file (best effort, never throws). */
async function writeBackup() {
  if (!bkHandle || bkState !== 'linked') return;
  try {
    const w = await bkHandle.createWritable();
    await w.write(JSON.stringify(S, null, 2));
    await w.close();
    S.settings.lastAuto = new Date().toISOString();
    try { localStorage.setItem(DB_KEY, JSON.stringify(S)); } catch (e) {}
    if (cur.view === 'set') { const el = $('#bkStamp'); if (el) el.textContent = fmtStamp(S.settings.lastAuto); }
  } catch (e) {
    bkState = 'need-permission';           // handle went stale or access revoked
    if (cur.view === 'set') renderSettings();
  }
}
const backupSoon = debounce(() => { writeBackup(); }, 1200);

/* Let the user pick / create the backup file (needs a click). */
async function linkBackup() {
  if (!FS_OK) return;
  try {
    bkHandle = await window.showSaveFilePicker({
      suggestedName: 'daily-ops-backup.json',
      types: [{ description: 'JSON backup', accept: { 'application/json': ['.json'] } }],
    });
  } catch (e) { return; }                  // user cancelled the picker
  await idb.set('file', bkHandle);
  bkState = 'linked';
  S.settings.autoBackup = true;
  persist();
  await writeBackup();
  toast('Backup linked — changes now mirror to that file');
  if (cur.view === 'set') renderSettings();
}

function unlinkBackup() {
  bkHandle = null; bkState = 'off';
  S.settings.autoBackup = false;
  idb.del('file'); persist();
  toast('Auto-backup off — your data stays in this browser');
  if (cur.view === 'set') renderSettings();
}

/* Re-grant write access after a restart, then flush current state. */
async function reconnectBackup() {
  if (!bkHandle) return;
  const p = await askPerm(bkHandle);
  if (p === 'granted') {
    bkState = 'linked';
    S.settings.autoBackup = true; persist();
    await maybeRestore();                  // if this browser is empty, pull the file back in
    await writeBackup();
    toast('Backup reconnected');
  } else {
    toast('Permission denied — auto-backup stays paused');
  }
  if (cur.view === 'set') renderSettings();
}

/* On launch: if this browser has no data yet but the linked file does,
   offer to restore from it — this is what makes a fresh browser recover. */
let restorePrompted = false;
async function maybeRestore() {
  if (restorePrompted || !bkHandle || bkState !== 'linked') return;
  const fresh = !localStorage.getItem(DB_KEY) && Object.keys(S.days).length === 0;
  if (!fresh) return;
  restorePrompted = true;
  try {
    const file = await bkHandle.getFile();
    const text = await file.text();
    if (!text.trim()) return;
    const restored = normalize(JSON.parse(text));
    if (Object.keys(restored.days).length === 0) return;
    const undo = snapshotUndo();
    S = restored; persist(); applyAccent(); route();
    toast('Restored ' + Object.keys(S.days).length + ' day(s) from your backup file', { undo, ms: 4000 });
  } catch (e) { /* unreadable file — leave the fresh seed in place */ }
}

/* Wire the linked handle back up at startup (no prompt without a gesture). */
async function initBackup() {
  if (!FS_OK) return;
  const h = await idb.get('file');
  if (!h) return;
  bkHandle = h;
  const p = await perm(h);
  if (p === 'granted') { bkState = 'linked'; await maybeRestore(); }
  else { bkState = 'need-permission'; renderReconnect(); }
}

/* Blue "reconnect" strip shown above any view when access needs re-granting. */
function renderReconnect() {
  if (bkState !== 'need-permission') return;
  if ($('#reconnectBar')) return;
  const bar = document.createElement('button');
  bar.id = 'reconnectBar';
  bar.className = 'reconnect fade-in';
  bar.setAttribute('data-act', 'bk-reconnect');
  bar.innerHTML = ic('down') + '<span>Backup file linked — click to re-grant write access for this session</span><span class="spacer"></span>' + ic('right');
  app.parentNode.insertBefore(bar, app);
}

/* ════════════════════════════════════════════════════════════════
   DAY GENERATION, TEMPLATE SYNC & STATS
   ════════════════════════════════════════════════════════════════ */
const byTimeThenOrder = (a, b) =>
  (a.time || '99:99').localeCompare(b.time || '99:99') || ((a.order ?? 0) - (b.order ?? 0));

/* Build a fresh routine list for a date from the recurring templates. */
function buildRoutine(ds) {
  const w = dowMon1(ds);
  return S.templates
    .filter(t => t.days.includes(w))
    .slice().sort(byTimeThenOrder)
    .map(t => ({ id: uid(), tid: t.id, title: t.title, time: t.time, cat: t.cat, color: t.color || null, done: false }));
}

/* Create a day record on demand — nothing is ever pre-created. */
function ensureDay(ds) {
  if (!isWeekday(ds)) return null;
  if (!S.days[ds]) { S.days[ds] = { routine: buildRoutine(ds), extra: [], notes: '' }; persist(); }
  return S.days[ds];
}

/* After editing templates in Settings, push the change into every
   already-generated day from today forward — while:
     • never touching past days,
     • never touching today once you've started ticking it,
     • keeping tick-state on unchanged items (matched by template id),
     • keeping any one-off routine items you added by hand to a day. */
function applyTemplatesForward() {
  const t0 = todayYMD();
  for (const ds of Object.keys(S.days)) {
    if (ds < t0 || !isWeekday(ds)) continue;
    const d = S.days[ds];
    if (d.off) continue;                                // day off — leave untouched
    const anyDone = d.routine.some(t => t.done);
    if (ds === t0 && anyDone) continue;                 // day already in progress
    const manual = d.routine.filter(t => !t.tid);       // hand-added, keep as-is
    const doneMap = {};
    d.routine.forEach(t => { if (t.tid) doneMap[t.tid] = t.done; });
    d.routine = buildRoutine(ds)
      .map(t => ({ ...t, done: !!doneMap[t.tid] }))
      .concat(manual);
  }
  saveSoon();
}
const applyTemplatesForwardSoon = debounce(applyTemplatesForward, 500);

function statsFor(ds) {
  const d = S.days[ds];
  if (!d) return { done: 0, total: 0 };
  const all = d.routine.concat(d.extra);
  return { done: all.filter(t => t.done).length, total: all.length };
}
function dayComplete(ds) {
  const s = statsFor(ds);
  return s.total > 0 && s.done === s.total;
}
const isOffDay = ds => !!(S.days[ds] && S.days[ds].off);
/* Status drives every colour on the calendar: off > done > overdue > part > todo */
function statusFor(ds) {
  if (isOffDay(ds)) return 'off';
  const { done, total } = statsFor(ds);
  if (total > 0 && done === total) return 'done';
  if (ds < todayYMD() && S.days[ds] && done < total) return 'over';
  if (done > 0) return 'part';
  return 'todo';
}
function streak() {
  let n = 0, ds = todayYMD();
  if (!isWeekday(ds)) ds = prevWeekday(ds);
  while (isOffDay(ds)) ds = prevWeekday(ds);   // leave never breaks a run — skip it
  if (dayComplete(ds)) n++;              // today counts once finished…
  ds = prevWeekday(ds);                  // …but an unfinished today doesn't break the run
  for (;;) {
    if (isOffDay(ds)) { ds = prevWeekday(ds); continue; }
    if (!dayComplete(ds)) break;
    n++; ds = prevWeekday(ds);
  }
  return n;
}
function monthStats(y, m) {
  const t0 = todayYMD();
  const last = new Date(y, m + 1, 0).getDate();
  let done = 0, total = 0;
  for (let d = 1; d <= last; d++) {
    const ds = ymd(new Date(y, m, d));
    if (!isWeekday(ds)) continue;
    if (ds > t0) break;                  // only weekdays that have happened
    if (isOffDay(ds)) continue;          // leave doesn't count either way
    total++;
    if (dayComplete(ds)) done++;
  }
  return { done, total };
}

const cptsPct = () => Math.round(S.settings.cptsDone / S.settings.cptsTotal * 100);

/* Longest run of fully-completed weekdays on record */
function bestStreak() {
  const keys = Object.keys(S.days).sort();
  if (!keys.length) return 0;
  let ds = keys[0]; if (!isWeekday(ds)) ds = nextWeekday(ds);
  const end = todayYMD();
  let best = 0, run = 0;
  while (ds <= end) {
    if (isOffDay(ds)) { ds = nextWeekday(ds); continue; }   // leave is neutral
    if (dayComplete(ds)) { run++; if (run > best) best = run; } else run = 0;
    ds = nextWeekday(ds);
  }
  return Math.max(best, streak());
}
/* The last n elapsed weekdays, oldest → newest */
function lastWeekdays(n) {
  let ds = todayYMD(); if (!isWeekday(ds)) ds = prevWeekday(ds);
  const out = [ds];
  while (out.length < n) { ds = prevWeekday(ds); out.unshift(ds); }
  return out;
}
/* Most recent past weekday still holding unfinished planned tasks */
function unfinishedFrom(ds) {
  let p = prevWeekday(ds);
  for (let hops = 0; hops < 10; hops++, p = prevWeekday(p)) {
    const rec = S.days[p];
    if (rec) { const u = rec.extra.filter(t => !t.done).length; if (u) return { ds: p, count: u }; }
  }
  return null;
}
/* Nudge the settings gear when a backup is overdue */
function backupDue() {
  if (Object.keys(S.days).length < 3) return false;
  if (!S.settings.lastExport) return true;
  return Date.now() - Date.parse(S.settings.lastExport) > 14 * 864e5;
}

/* ════════════════════════════════════════════════════════════════
   MINI MARKDOWN  —  bold, italic, `code`, ```blocks```, lists, ###
   (input is escaped first, so notes can safely contain HTML/payloads)
   ════════════════════════════════════════════════════════════════ */
function mdRender(src) {
  if (!src || !src.trim()) return '<p class="md-empty">Nothing here yet.</p>';
  src = src.replace(/\r\n?/g, '\n');
  const fences = [];
  src = src.replace(/```([\s\S]*?)```/g, (m, code) => {
    fences.push('<pre class="md-pre"><code>' + esc(code.replace(/^\n|\n$/g, '')) + '</code></pre>');
    return '\u0000' + (fences.length - 1) + '\u0000';
  });
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code class="md-code">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
  let html = '', list = null;
  const closeList = () => { if (list) { html += '</' + list + '>'; list = null; } };
  for (const raw of src.split('\n')) {
    const t = raw.trim();
    let m;
    if (m = t.match(/^\u0000(\d+)\u0000$/)) { closeList(); html += fences[+m[1]]; continue; }
    if (!t) { closeList(); continue; }
    if (m = t.match(/^(#{1,3})\s+(.*)/)) { closeList(); const h = m[1].length + 3; html += `<h${h} class="md-h${h}">` + inline(m[2]) + `</h${h}>`; continue; }
    if (m = t.match(/^[-*]\s+(.*)/)) { if (list !== 'ul') { closeList(); html += '<ul class="md-ul">'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    if (m = t.match(/^\d+[.)]\s+(.*)/)) { if (list !== 'ol') { closeList(); html += '<ol class="md-ol">'; list = 'ol'; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    closeList(); html += '<p class="md-p">' + inline(t) + '</p>';
  }
  closeList();
  return html;
}

/* ════════════════════════════════════════════════════════════════
   TOASTS & UNDO  —  destructive actions never ask "are you sure";
   they happen, and the toast offers Undo (full-state snapshot).
   ════════════════════════════════════════════════════════════════ */
function toast(msg, opts = {}) {
  const box = $('#toasts');
  while (box.children.length > 2) box.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast' + (opts.variant ? ' toast-' + opts.variant : '');
  el.innerHTML = (opts.icon ? '<span class="toast-ic">' + ic(opts.icon) + '</span>' : '') + '<span>' + esc(msg) + '</span>';
  if (opts.undo) {
    const b = document.createElement('button');
    b.className = 'toast-undo'; b.textContent = 'Undo';
    b.onclick = () => { opts.undo(); el.remove(); };
    el.appendChild(b);
  }
  if (opts.actionLabel && opts.action) {
    const b = document.createElement('button');
    b.className = 'toast-undo'; b.textContent = opts.actionLabel;
    b.onclick = () => { opts.action(); el.remove(); };
    el.appendChild(b);
  }
  box.appendChild(el);
  setTimeout(() => el.remove(), opts.ms || 6500);
}
/* Take a snapshot *before* a destructive change; returns the undo fn. */
function snapshotUndo() {
  const snap = structuredClone(S);
  return () => { S = snap; persist(); applyAccent(); route(); toast('Restored'); };
}

/* Progress ring used on calendar cells */
function ring(pct, cls, size = 26, sw = 3) {
  const r = (size - sw) / 2, c = 2 * Math.PI * r;
  return `<svg class="ring ${cls}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle class="ring-track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}"/>
    <circle class="ring-val" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${sw}"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - pct)).toFixed(2)}"
      transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}

  const t0 = todayYMD();
  if (!isWeekday(t0)) {
    const nx = nextWeekday(t0);
    return `<button class="today-strip fade-in" data-act="open-day" data-ds="${nx}">

      <span class="ts-go">${ic('right')}</span></button>`;
